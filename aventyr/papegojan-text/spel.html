<title>Papegojan som visste för mycket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Spelmotorns utseende. Gemensamt för alla äventyr. */

/* Layout: en arkivmapp för ett fall. Statusrad överst, maskinskrivet protokoll i mitten, inmatningsrad längst ner. */
:root {
  --bg: #e6dbbd;       /* manilamapp */
  --paper: #f4eedc;    /* papper */
  --ink: #2a251d;      /* skrivmaskinsbläck */
  --muted: #6e6552;
  --stamp: #a8281f;    /* stämpelrött */
  --rule: #cdbf98;
  --pil: #c48b00; --pilskugga: rgba(42, 37, 29, .35);   /* pilen för mer text */
  --font-type: "Courier Prime", "Courier New", Courier, monospace;
  --font-head: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141922; --paper: #1c2330; --ink: #e5e0d2; --muted: #8e95a3; --stamp: #ff7c6c; --rule: #2e3746;
    --pil: #f2c230; --pilskugga: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141922; --paper: #1c2330; --ink: #e5e0d2; --muted: #8e95a3; --stamp: #ff7c6c; --rule: #2e3746;
    --pil: #f2c230; --pilskugga: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-type); font-size: 16px; line-height: 1.55;
  display: flex; flex-direction: column;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  width: 100%; max-width: 46rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.status {
  border-bottom: 2px solid var(--ink);
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .06em;
}
header.status .wrap {
  display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between;
  padding-block: 10px 8px;
}
.status .title { font-weight: 600; font-size: 1.05rem; color: var(--stamp); }
.status .where { font-weight: 500; font-size: 1rem; flex: 1 1 auto; min-width: 0; }
.status .nums { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
main {
  flex: 1 1 auto; overflow-y: auto; min-height: 0;
}
#log { padding-block: 20px 12px; display: flex; flex-direction: column; gap: 12px; }
#log p { margin: 0; max-width: 65ch; white-space: pre-wrap; overflow-wrap: anywhere; }
#log .cmd { color: var(--muted); }
#log .cmd::before { content: "> "; }
#log .room { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: 1.05rem; margin-top: 6px; }
#log .sys { color: var(--muted); font-style: italic; }
#log .stamp {
  align-self: flex-start; color: var(--stamp); border: 3px double var(--stamp);
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .12em; font-weight: 600;
  padding: 4px 12px; transform: rotate(-2deg); margin-block: 4px;
}
#log .banner {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .1em;
  font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.05; font-weight: 600; text-wrap: balance;
}
#log .score { color: var(--stamp); font-weight: 700; }
#log .replik { color: var(--stamp); font-style: italic; }
#log .replik.pratar::after { content: "\258C"; font-style: normal; animation: markor 1s steps(1) infinite; margin-left: 2px; }
@keyframes markor { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #log .replik.pratar::after { animation: none; } }
/* Startskärmen: en filmaffisch med bilden i fullskärm, loggan överst och en knapp längst ner. */
.splash {
  position: fixed; inset: 0; z-index: 100; background: #05070b; color: #efe6d0;
  display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center;
  padding: max(28px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transition: opacity 0.9s ease; cursor: pointer; overflow: hidden;
}
.splash.borta { opacity: 0; pointer-events: none; }
.splash:focus-visible { outline: 2px solid #ffb45a; outline-offset: -6px; }
.splash picture, .splash img, .splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.splash img { object-fit: cover; object-position: 50% 45%; animation: splashin 2.4s ease-out both; }
@keyframes splashin { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
.splash::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgba(3,4,8,0.75) 0%, rgba(3,4,8,0) 32%, rgba(3,4,8,0) 62%, rgba(3,4,8,0.85) 100%); }
.splash > .logo { position: relative; z-index: 1; }
.logo { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; animation: logoin 2.2s 0.5s ease-out both; }
@keyframes logoin { from { opacity: 0; transform: translateY(-8px); letter-spacing: 0.3em; } to { opacity: 1; transform: none; } }
.logo .ort { font-family: var(--font-head); text-transform: uppercase; letter-spacing: 0.32em; font-size: clamp(0.7rem, 2.4vw, 0.9rem); color: #c9b48d; }
.logo .titel { font-family: var(--font-head); font-weight: 600; text-transform: uppercase; line-height: 0.9;
  font-size: clamp(3rem, min(15vw, 11vh), 7.5rem); letter-spacing: 0.06em; color: #f1e7cf; white-space: nowrap;
  text-shadow: 0 0 28px rgba(255, 168, 80, 0.35), 0 2px 0 rgba(0,0,0,0.6); }
.logo .under { display: flex; align-items: center; gap: 12px; font-family: var(--font-type); font-style: italic;
  font-size: clamp(1.1rem, min(4.6vw, 3.4vh), 2rem); color: #f1e7cf; }
.logo .under::before, .logo .under::after { content: ""; width: clamp(24px, 8vw, 64px); height: 1px; background: #c4382e; }
@media (prefers-reduced-motion: reduce) { .splash img, .logo { animation: none; } .splash { transition: none; } }
/* Bildrutan: pixelbilden skalas upp skarpt, utan utsmetning. */
.scen { margin: 0; background: #0b0d1a; border-bottom: 2px solid var(--ink); display: flex; justify-content: center; }
.scen canvas {
  display: block; width: 384px; height: 240px; max-width: 100%; object-fit: contain;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
.scen canvas.ritar { animation: rita 0.9s steps(24, end) both; }
@keyframes rita { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
@media (prefers-reduced-motion: reduce) { .scen canvas.ritar { animation: none; } }
footer.input { border-top: 2px solid var(--ink); background: var(--paper); padding-bottom: env(safe-area-inset-bottom, 0px); }
footer.input .wrap { padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
form { display: flex; gap: 8px; align-items: center; }
form label { font-weight: 700; color: var(--stamp); }
#cmd {
  flex: 1 1 auto; min-width: 0; font: inherit; color: var(--ink); background: transparent;
  border: none; border-bottom: 1px dashed var(--rule); padding: 6px 2px; outline: none;
}
#cmd:focus-visible { border-bottom-color: var(--stamp); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .06em; font-size: .8rem;
  color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 2px;
  padding: 4px 10px; cursor: pointer;
}
.quick button:hover { border-color: var(--ink); }
.quick button:focus-visible { outline: 2px solid var(--stamp); outline-offset: 1px; }

/* Klickläge: ägodelar som knappar, en namnskylt i bilden och en meny vid det man trycker på */
.scen { position: relative; }
.klicklage .scen canvas { touch-action: manipulation; }
.agodelar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.agodelar .rubrik { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; color: var(--muted); margin-right: 2px; }
.agodelar button {
  font-family: var(--font-type); font-size: .85rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--rule); border-radius: 2px; padding: 3px 9px; cursor: pointer;
}
.agodelar button:hover, .agodelar button:focus-visible { border-color: var(--stamp); outline: none; }
.namnskylt {
  position: absolute; transform: translate(-50%, -150%); pointer-events: none; white-space: nowrap;
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .8rem;
  color: #f1e7cf; background: rgba(10, 10, 16, .82); padding: 2px 8px; border-radius: 2px;
}
.klickmeny {
  position: fixed; z-index: 60; min-width: 150px; max-width: min(260px, calc(100vw - 16px));
  display: flex; flex-direction: column; background: var(--paper); border: 2px solid var(--ink);
  box-shadow: 0 6px 24px rgba(0, 0, 0, .35); padding: 4px;
}
.klickmeny .rubrik {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .8rem;
  color: var(--stamp); padding: 4px 8px 6px; border-bottom: 1px dashed var(--rule); margin-bottom: 2px;
}
.klickmeny button {
  font-family: var(--font-type); font-size: .95rem; text-align: left; color: var(--ink); background: transparent;
  border: none; padding: 8px 10px; cursor: pointer;
}
.klickmeny button:hover, .klickmeny button:focus-visible { background: var(--bg); outline: none; color: var(--stamp); }

/* Renodlat klickläge: inget inmatningsfält, bara ägodelar, utgångar och en menyknapp */
.klicklage form { display: none; }
#menyknapp {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .8rem;
  color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 2px; padding: 3px 10px; cursor: pointer;
}
#menyknapp:hover, #menyknapp:focus-visible { color: var(--stamp); border-color: var(--stamp); outline: none; }
.agodelar { flex-direction: column; align-items: stretch; }
.klickrad { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.klickrad .rubrik { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; color: var(--muted); margin-right: 2px; }
.klickrad button {
  font-family: var(--font-type); font-size: .85rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--rule); border-radius: 2px; padding: 3px 9px; cursor: pointer;
}
.klickrad button:hover, .klickrad button:focus-visible { border-color: var(--stamp); outline: none; }
.las-endast { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.las-endast button:focus { position: fixed; left: 8px; top: 8px; width: auto; height: auto; clip: auto; z-index: 70; }

/* Gul pil som visar att det finns mer text nedanför: en tonad kant längst ner i textytan och en liten pixelpil.
   Den går inte att klicka på, man scrollar som vanligt. */
#merpil {
  position: fixed; z-index: 5; height: 36px; padding: 0 16px 6px;
  display: flex; align-items: flex-end; justify-content: flex-end;
  background: linear-gradient(to bottom, transparent, var(--bg) 80%);
  color: var(--pil); pointer-events: none;
}
#merpil svg { width: 18px; height: 12px; filter: drop-shadow(0 1px 0 var(--pilskugga)); }
#merpil[hidden] { display: none; }

/* Bekräftelsedialog, t.ex. innan spelet börjar om */
dialog.bekrafta {
  width: min(340px, calc(100vw - 32px)); padding: 18px 20px 16px; color: var(--ink); background: var(--paper);
  border: 2px solid var(--ink); box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
}
dialog.bekrafta::backdrop { background: rgba(5, 7, 11, .6); }
dialog.bekrafta h2 {
  margin: 0 0 8px; font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em;
  font-size: 1.1rem; font-weight: 600; color: var(--stamp);
}
dialog.bekrafta p { margin: 0 0 16px; font-size: .95rem; }
dialog.bekrafta .knappar { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
dialog.bekrafta button {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .85rem;
  padding: 8px 14px; border-radius: 2px; cursor: pointer; border: 1px solid var(--ink);
  background: transparent; color: var(--ink);
}
dialog.bekrafta button.ja { background: var(--stamp); border-color: var(--stamp); color: var(--paper); }
dialog.bekrafta button:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }

/* Samtal: svarsalternativ som knappar */
.samtalsval { display: flex; flex-direction: column; gap: 6px; padding-block: 2px 14px; max-width: 65ch; }
.samtalsval button {
  font-family: var(--font-type); font-size: .9rem; line-height: 1.3; text-align: left; color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule); border-left: 3px solid var(--stamp); border-radius: 2px;
  padding: 6px 10px; cursor: pointer;
}
.samtalsval button:hover, .samtalsval button:focus-visible { border-color: var(--stamp); outline: none; color: var(--stamp); }
.samtal-pagar.klicklage .agodelar { display: none; }
#log .val { color: var(--muted); margin-left: 1.5em; }
</style>

  handlingar: {

    papegojtal: [
      { satt: "tacker" },
      "Du tar av dig trenchcoaten och sveper den försiktigt över buren. Det blir tyst. Caruso muttrar något. Sedan, i mörkret, börjar han prata i sömnen, med röster som inte är hans egna:",
      { replik: "papegoja", sedan: [
        { nollstall: "tacker" },
        { om: { inteFlagga: "papegoja" }, text: "Lola stirrar på buren. \"Godnatt, Caruso. Det är ju vad jag säger till honom varje kväll. Men de andra rösterna... Klockan slår tretton? Ingen klocka slår tretton!\" Hon tänker efter. \"Tror jag.\"" },
        { om: { flagga: "papegoja" }, text: "Lola nickar. \"Samma sak igen. Han har ett bra minne, det har han. Bättre än mitt.\"" },
        { sys: "Du tar tillbaka trenchcoaten. Caruso vaknar och ser mycket förolämpad ut." },
        { poang: "papegoja" },
        { satt: "papegoja" },
      ] },
    ],
    kopParaply: [
      { om: { inteBar: "pengar" }, text: "\"Två dollar\", säger Mr. Pickles utan att titta upp. \"Kroken ingår.\" Du har inga två dollar. Du ställer tillbaka paraplyet." },

      { om: { bar: "pengar" }, satt: "paraplyKopt", ljud: "kassa" },

      { om: { bar: ["pengar", "paraply"] }, poang: "paraply" },
      { om: { bar: ["pengar", "paraply"], flagga: "batterierKopt" }, flytta: "pengar" },
    ],
    kopBatterier: [

      { om: { bar: "pengar" }, flytta: "batterier", till: "spelare" },
      { om: { bar: "pengar" }, satt: "batterierKopt", ljud: "kassa" },
      { om: { bar: "pengar" }, text: "Du lägger en dollar på disken och tar batterierna. \"Ever-Bright\", säger Mr. Pickles. \"De lyser längre än de flesta äktenskap.\"" },
      { om: { bar: ["pengar", "batterier"] }, poang: "batterier" },
      { om: { bar: ["pengar", "batterier"], flagga: "paraplyKopt" }, flytta: "pengar" },

      { om: { inteFlagga: "klocka" }, text: "\"Rådhusklockan slår aldrig fel\", säger han. \"Men min egen fasadklocka, här ute på Boulevarden, slår tretton slag vid midnatt. Det har den gjort sedan i våras. Kunderna klagar. Jag säger att det är en extra timme, helt gratis.\"" },

      "Lola rycker åt sig noterna och kramar dem så att det prasslar. \"Mina noter! Mina älskade noter!\" Hon kramar dig också, och du blir puderad från topp till tå. Caruso vrålar KVACK av ren glädje.",
      { om: { flagga: "bevis" }, text: "Klockan nio står Lola på scenen. Pianisten är borta, han sitter i en polisbil utanför med Moes handduk runt handlederna, så Lola sjunger till Moes piano. Moe kan tre ackord. Det räcker." },
      { om: { inteFlagga: "bevis" }, text: "Klockan nio står Lola på scenen. Pianisten Freddie börjar spela, svettig som en ostbit i juli. Mitt i första versen sträcker Caruso på halsen, får syn på honom och skriker med full kraft: \"TRE TRAPPOR UPP! TYST, FÅGEL!\" Freddie tappar takten, sedan modet, och erkänner alltihop i radio, inför hela Grand Harbor." },

    { verb: "tänd", objekt: "ficklampa", gor: [{ ljud: "klick" }, "Du knäpper på ficklampan. Den blinkar en gång, svagt, som ett sista farväl, och slocknar. Batterierna är slut."] },
    { verb: "tänd", gor: ["Du har inget att tända. Du har slutat röka, enligt dig själv."] },
    { verb: "använd", objekt: ["batterier", "ficklampa"], mottagare: ["ficklampa", "batterier"], om: { bar: ["batterier", "ficklampa"] }, gor: [
      { flytta: "batterier" }, { satt: "ljus", ljud: "klick" },
      "Du skruvar upp ficklampan, skakar ut de gamla batterierna, som ser ut som två små fossil, och sätter i de nya. Du knäpper på. Ett starkt, vitt ljus. Garanterat ljus i mörka stunder, stod det på kartongen. Du har haft många mörka stunder. Nu har du åtminstone ljus till dem.",
      { poang: "ljus" },
    ] },

    // Sal, Benny och Bruno: inga pengar ska gå åt till korv den här gången
    { verb: ["köp", "ta"], objekt: ["kiosk", "korvvagn"], gor: ["Du är frestad, men du har ett fall att lösa och en budget som en kyrkmus. Korven får vänta."] },
    { verb: "köp", gor: ["Du har inte råd med något du inte behöver. Det är i stort sett allt."] },
    { verb: "prata", objekt: "kiosk", gor: ["\"Mopsdetektiven!\" ropar Sal. \"Du är bra för affärerna. Folk vill äta samma korv som du. Jag säljer dem alla samma korv. Den enda jag har.\""] },
    { verb: ["ge", "visa"], mottagare: "kiosk", gor: ["Sal tittar på {objekt}. \"Kan man ha senap på det? Nej? Då är jag inte intresserad.\""] },
    { verb: "prata", objekt: "portier", gor: ["\"Fru Pettigrew är på kryssning, sir. Med Lord Waffles. Han har egen hytt och egen kapten.\" Portiern drar på munnen. \"Det har aldrig hänt förut.\""] },
    { verb: ["ge", "visa"], mottagare: "portier", gor: ["Portiern tittar på {objekt} med artig ointresse. \"Mycket fint, sir.\" Det låter som en dom."] },
    { verb: "prata", objekt: "benny", gor: ["\"Mopsmannen!\" säger Benny och vänder en dumpling i luften. \"Har du ett nytt fall? Jag vet inget om det, vad det än är. Ta en lyckokaka. De vet mer än jag nuförtiden.\""] },
    { verb: ["ge", "visa"], mottagare: "benny", gor: ["Benny skakar på huvudet. \"Det där har jag inget att säga om. Ta en lyckokaka.\""] },
    { verb: "ta", objekt: "lyckokaka", gor: [{ flytta: "lyckokaka", till: "spelare" }, "Du tar en lyckokaka ur skålen. \"Gratis\", säger Benny. \"Fram till att du läser den.\""] },
    { verb: "bryt", om: { inteInom: "lyckokaka" }, gor: ["Du har ingen lyckokaka."] },
    { verb: ["bryt", "läs", "öppna", "ät"], objekt: "lyckokaka", gor: [
      { flytta: "lyckokaka", ljud: "krack" },
      "Du bryter lyckokakan och vecklar ut lappen. Det står: \"DEN SOM RÄKNAR VÅNINGARNA KOMMER HÖGST.\" På baksidan: \"Dina lyckotal: 3 och 13.\"",
      { sys: "Du äter upp kakan. Den smakar papp och förhoppning." },
    ] },
    { verb: "bryt", gor: ["Du har inget att bryta, utom möjligen ditt nyårslöfte."] },
    { verb: "prata", objekt: "bruno", gor: ["\"Detektiven!\" Bruno ler så att det knakar i ansiktet. \"Bruno säljer korv nu. Bruno har lärt sig att man kan få korv utan att vakta något. Bruno är lycklig.\" Han lägger till: \"Bruno har inte sett något. Men Bruno har inte heller tittat.\""] },
    { verb: ["ge", "visa"], mottagare: "bruno", gor: ["Bruno tittar länge på {objekt}. \"Kan man ha senap på det?\" Det kan man inte. Han tappar intresset."] },
    { verb: "ta", objekt: "dorr", gor: ["Du har varit i det där lagret. Du har inget mer att göra där. Mopsen är hemma."] },

    // Boulevarden
    { verb: "prata", objekt: "tidningsforsaljare", om: { flagga: "papegoja" }, gor: ["\"EXTRA, EXTRA!\" ropar Lenny, och sedan med vanlig röst: \"En klocka som slår tretton? Det är urmakarns fasadklocka, här bort mot torget. Den slår tretton vid midnatt, varenda natt. Halva gatan har klagat. Rådhusklockan? Nej, den går som ett schweiziskt ur. Den är tråkig.\"", { kor: "klockflagga" }] },
    { verb: "prata", objekt: "tidningsforsaljare", gor: ["\"EXTRA, EXTRA! LOLA LARUE SJUNGER I RADIO IKVÄLL! MYSTISK STÖLD PÅ BLÅ OSTRONET!\" Lenny sänker rösten. \"Det där med stölden har jag hittat på själv. Men jag hörde att det stämde. Jag har tur med sånt.\""] },
    { verb: ["ge", "visa"], mottagare: "tidningsforsaljare", gor: ["Lenny tittar på {objekt}. \"Det är ingen nyhet\", säger han. \"Kom tillbaka när det har hänt något med det.\""] },
    { verb: ["ta", "köp"], objekt: "tidningsforsaljare", gor: ["En tidning kostar fem cent. Du har inga cent. Lenny låter dig läsa rubriken gratis: LOLA LARUE SJUNGER I RADIO IKVÄLL."] },
    { verb: ["gå", "köp", "ta"], objekt: "kafe", gor: ["Kaffet kostar tio cent. Du har inga cent. Du nöjer dig med doften."] },
    { verb: "ta", objekt: "automat", gor: ["Automaten tar en cent. Du har bara dollar, om du ens har det. Det känns som en sorts klassresa."] },
    { verb: ["ta", "öppna"], objekt: "brandpost", gor: ["Om du öppnar brandposten blir det översvämning på Boulevarden och du blir omtalad i tidningen igen. Inte på det bra sättet."] },
    { verb: "ta", objekt: "fasadklocka", gor: ["Klockan sitter tre meter upp och väger som en mindre bil. Du låter den sitta."] },
    { verb: "lyssna", om: { nagon: [{ plats: "blvd_v" }, { plats: "urmakare" }] }, gor: ["Tick. Tack. Tick. Tack. Klockorna pratar i munnen på varandra, och ingen av dem säger vad klockan är."] },

    // Porttelefonen
    { verb: ["öppna", "gå"], objekt: "porttelefon", gor: ["Porten är låst. Den kan bara öppnas inifrån, av någon som surrar upp dig."] },
    { verb: "ring", om: { plats: "blvd_v", ord: ["ostrowski*", "första", "1"] }, gor: [{ ljud: "surr" }, "Det surrar. En gammal mansröst skriker i högtalaren: \"VA? VEM? JAG HÖR INTE! JAG ÄR I BADKARET!\" Det klickar. Sedan surrar det igen: \"VEM VAR DET?\" Sedan tystnad."] },
    { verb: "ring", om: { plats: "blvd_v", ord: ["pettersson*", "andra", "2"] }, gor: [{ ljud: "surr" }, "En trött kvinnoröst svarar, och bakom den skriker minst tre barn. \"Om du säljer något köper vi det inte. Om du köper något säljer vi barnen.\" Klick."] },
    { verb: "ring", om: { plats: "blvd_v", ord: ["smith*", "tredje", "3"], flagga: "papegoja", inteFlagga: "adress" }, gor: [{ ljud: "surr" }, "Det surrar länge. Ingen svarar hos H. Smith, tre trappor upp.", "Tre trappor upp. Du tittar upp mot fasadklockan, och sedan tillbaka på namnskylten. Ingen heter Smith på riktigt. Inte i den här stan.", { poang: "adress" }, { satt: "adress" }] },
    { verb: "ring", om: { plats: "blvd_v", ord: ["smith*", "tredje", "3"] }, gor: [{ ljud: "surr" }, "Det surrar länge. Ingen svarar hos H. Smith. Antingen är han inte hemma, eller så vill han inte vara det."] },
    { verb: "ring", om: { plats: "blvd_v", ord: ["zelda*", "fjärde", "4", "spådam*"] }, gor: [{ ljud: "surr" }, "Innan det ens har surrat färdigt svarar en mörk kvinnoröst: \"Jag visste att du skulle ringa. Jag ser... jag ser en stege. Och något med en krok. Och en man som klättrar till fel våning.\" Paus. \"Det blir fem dollar.\" Du lägger på."] },
    { verb: "ring", om: { plats: "blvd_v" }, gor: ["Vem vill du ringa på hos? Det står fyra namn på porttelefonen."] },
    { verb: "ring", gor: ["Det finns inget att ringa med här. Din telefon på kontoret kan bara ta emot samtal, enligt överenskommelse med telefonbolaget."] },

    // Torget
    { verb: "ta", objekt: "fontan", gor: ["Du sträcker dig efter mynten i fontänen. Damen på bänken harklar sig. \"Det där är någons önskningar, unge man.\" Du drar tillbaka handen. Grundaren pekar anklagande åt öster."] },
    { verb: "prata", objekt: "dam", om: { flagga: "papegoja" }, gor: ["\"Klockan som slår tretton?\" Damen kastar en brödsmula. \"Inte rådhusklockan, den har aldrig slagit fel. Men det är någon klocka längre in på Boulevarden som slår tretton varje midnatt. Jag räknar alltid slagen. Det är det enda som är spännande i mitt liv.\""] },
    { verb: "prata", objekt: "dam", gor: ["\"Duvorna och jag har suttit här sedan 1902\", säger damen. \"Inte samma duvor, förstås. Samma bänk.\" Hon räcker dig en brödbit. Du äter den. Det är din middag."] },
    { verb: ["ge", "visa"], mottagare: "dam", gor: ["Damen tittar på {objekt} och sedan på dig. \"Det kan man inte mata duvor med\", säger hon. Det är hennes enda mått på saker."] },
    { verb: ["ta", "klappa"], objekt: "duvor", gor: ["Duvorna flaxar upp, gör en lov över torget och landar exakt där de var. De har övat."] },
    { verb: "ta", objekt: "radhusklocka", gor: ["Rådhusklockan är stor som ett garage och sitter trettio meter upp. Du tar den med blicken i stället."] },

    // Pantbanken: checken blir pengar, pengarna blir paraply och batterier
    { verb: ["ge", "visa"], objekt: "check", mottagare: "pantlanare", gor: [
      { flytta: "check" }, { flytta: "pengar", till: "spelare", ljud: "kassa" },
      "Mr. Pickles lyfter checken mot ljuset. Hans ögonbryn klättrar upp över glasögonen. \"Pettigrew-checken! Den som banken vägrade lösa in! Hela stan har skrattat åt den.\" Han ler för första gången på flera år. \"Jag ställer den i skyltfönstret. Folk kommer att komma hit bara för att titta. Tre dollar.\"",
      "Han räknar upp tre skrynkliga dollarsedlar på disken. Det är den bästa affär du har gjort i år, och det är november.",
      { poang: "pant" },
    ] },
    { verb: "visa", mottagare: "pantlanare", gor: ["Mr. Pickles tittar på {objekt} genom glasögonen, och sedan över dem. \"Det köper jag inte. Inte ens för en cent. Och då köper jag nästan allt.\""] },
    { verb: "ge", objekt: "pengar", mottagare: "pantlanare", gor: ["\"Vad vill ni köpa?\" säger Mr. Pickles. \"Peka på det. Jag tar inte emot pengar på måfå. Jag är en hederlig man, på mitt eget sätt.\""] },
    { verb: "ge", mottagare: "pantlanare", gor: ["Mr. Pickles vänder och vrider på {objekt}. \"Värdelöst\", säger han och lämnar tillbaka det. \"Kom tillbaka med något som andra skrattar åt. Det säljer.\""] },
    { verb: "prata", objekt: "pantlanare", om: { bar: "check" }, gor: ["\"Vad har ni där under armen?\" säger Mr. Pickles och kisar mot ramen. \"Visa mig.\""] },
    { verb: "prata", objekt: "pantlanare", gor: ["\"Allt har ett pris\", säger Mr. Pickles. \"Utom det som är värdelöst. Och ibland även det, om det är tillräckligt löjligt.\" Han putsar glasögonen igen."] },
    { verb: "ta", objekt: "saxofon", gor: ["\"Fyrtio dollar\", säger Mr. Pickles. Du har inte fyrtio dollar. Du har aldrig haft fyrtio dollar på en gång. Saxofonen stannar på väggen och tittar sorgset på dig."] },
    { verb: "ta", objekt: "kristallkula", gor: ["\"Den är inte till salu\", säger Mr. Pickles. \"Den förutspådde att jag skulle säga det.\""] },
    { verb: "ta", objekt: "algskalle", gor: ["Du sträcker dig efter damhatten. Mr. Pickles skakar på huvudet. \"Den hör till älgen nu. De har ett förhållande.\""] },

    // Urmakaren
    { verb: "prata", objekt: "urmakaren", gor: [{ kor: "klockinfo" }] },
    { verb: ["ge", "visa"], mottagare: "urmakaren", gor: ["Otto Tick studerar {objekt} genom luppen. \"Det går inte\", säger han till sist. \"Det har aldrig gått. Det kommer aldrig att gå. Det är inte ett ur.\""] },
    { verb: "ta", objekt: ["klockor", "golvur", "gok"], gor: ["\"Titta gärna\", säger Otto Tick. \"Men inga fingrar på urtavlorna. Fingrar är urens fiende nummer ett. Nummer två är damm. Nummer tre är kunder.\""] },
    { verb: "undersök", objekt: "gok", nar: "efter", gor: [{ ljud: "gok" }, "Precis då öppnas luckan och göken ropar två gånger. Den tittar på dig, tycker uppenbarligen inte om det den ser, och smäller igen luckan."] },

    // Gränden och brandstegarna
    { verb: "använd", objekt: "paraply", mottagare: "brandstege_ur", om: { inteFlagga: "stegeUr" }, gor: [
      { satt: "stegeUr", ljud: "stege" },
      "Du sträcker upp paraplyet, hakar kroken om stegens nedersta tvärslå och drar. Det gnisslar, det skramlar, och stegen glider ner med ett järnslammer som ekar mellan husen. Katten på soptunnan tittar inte ens upp.",
      { poang: "stege" },
    ] },
    { verb: "använd", objekt: "paraply", mottagare: "brandstege_tvatt", om: { inteFlagga: "stegeTvatt" }, gor: [
      { satt: "stegeTvatt", ljud: "stege" },
      "Du hakar kroken om tvätteriets stege och drar. Den kommer ner i ett moln av ånga och rost.",
    ] },
    { verb: "använd", objekt: "paraply", mottagare: ["brandstege_ur", "brandstege_tvatt"], gor: ["Stegen är redan nere."] },
    { verb: "använd", objekt: "paraply", gor: ["Du fäller upp paraplyet. Det regnar inte just här. Du fäller ihop det igen och känner dig dum."] },
    { verb: "klättra", objekt: "brandstege_ur", om: { inteFlagga: "stegeUr" }, gor: ["Den nedersta stegen hänger långt ovanför ditt huvud. Du hoppar. Du når inte. Du hoppar igen, för säkerhets skull, och katten på soptunnan tittar bort av ren medkänsla."] },
    { verb: "klättra", objekt: "brandstege_tvatt", om: { inteFlagga: "stegeTvatt" }, gor: ["Tvätteriets stege hänger lika högt som urmakarens. Du hoppar en gång, mest för formens skull."] },
    { verb: "klättra", objekt: "brandstege_ur", om: { ord: ["första", "1"] }, gor: [{ ljud: "knarr" }, "Du klättrar upp till första våningen och tittar in genom fönstret. En gammal man ligger i ett badkar med en tidning och en gummianka. Han ser dig. Han skriker inte. Han höjer gummiankan till hälsning. Du klättrar ner igen."] },
    { verb: "klättra", objekt: "brandstege_ur", om: { ord: ["andra", "2"] }, gor: [{ ljud: "knarr" }, "Du klättrar upp till andra våningen. Genom fönstret stirrar tre identiska småbarn på dig med syltfläckar runt munnen. Ett av dem räcker ut tungan. Ett annat gör samma sak. Det tredje börjar gråta. Du klättrar ner innan föräldrarna kommer."] },
    { verb: "klättra", objekt: "brandstege_ur", om: { ord: ["tredje", "3"] }, gor: [{ ljud: "knarr" }, { om: { inteFlagga: "brandtrappa" }, text: "Du klättrar upp till tredje våningen. Brandstegen gungar under dig, och regnet rinner in i kragen. Fönstret här har fördragna gardiner, och det står på glänt." }, { satt: "brandtrappa" }, { ga: "brandtrappa" }] },
    { verb: "klättra", objekt: "brandstege_ur", om: { ord: ["fjärde", "4"] }, gor: [{ ljud: "knarr" }, "Du klättrar upp till fjärde våningen. Innan du hinner titta in öppnas fönstret av en kvinna i turban med kristaller i öronen. \"Jag visste att du skulle komma\", säger Madame Zelda. \"Fel våning.\" Hon stänger fönstret. Du klättrar ner igen och undrar hur hon visste."] },
    { verb: "klättra", objekt: "brandstege_ur", gor: ["Vilken våning? Det finns fyra."] },
    { verb: "klättra", objekt: "brandstege_tvatt", om: { ord: ["första", "1"] }, gor: [{ ljud: "knarr" }, "Första våningen i tvätteriet är ett enda moln av ånga. Någon därinne sjunger opera ackompanjerad av en mangel. Du klättrar ner, fuktig och kulturellt berikad."] },
    { verb: "klättra", objekt: "brandstege_tvatt", om: { ord: ["andra", "2"] }, gor: [{ ljud: "knarr" }, "På andra våningen hänger hundratals vita skjortor på tork. Det ser ut som ett möte för spöken. Ingen av dem har något att säga dig."] },
    { verb: "klättra", objekt: "brandstege_tvatt", om: { ord: ["tredje", "3"] }, gor: [{ ljud: "knarr" }, "Tredje våningen i tvätteriet är ett förråd fullt av långkalsonger, prydligt vikta och märkta med namn. En av dem är märkt BORGMÄSTAREN. Du klättrar ner och bestämmer dig för att aldrig nämna det."] },
    { verb: "klättra", objekt: "brandstege_tvatt", om: { ord: ["fjärde", "4"] }, gor: [{ ljud: "knarr" }, "Fjärde våningen är vinden, och fönstret är spikat igen. På fönsterbrädan sitter en duva som ser ut att ha bott här längre än tvätteriet. Du klättrar ner igen."] },
    { verb: "klättra", objekt: "brandstege_tvatt", gor: ["Vilken våning? Det finns fyra."] },
    { verb: "klättra", om: { plats: "brandtrappa" }, gor: [{ utfor: "ner" }] },
    { verb: "klättra", gor: ["Det finns inget här att klättra på. Inte för en man i din ålder och din rock."] },
    { verb: ["ta", "sök", "öppna"], objekt: "soptunnor", gor: ["Du rotar lite bland soporna: fiskben, en trasig väckarklocka och en tom flaska hårvatten av märket SLICK. Inget du vill bära på. Katten följer varje rörelse med professionellt intresse."] },
    { verb: ["prata", "klappa", "ta"], objekt: "grandkatt", gor: ["Katten låter sig klappas exakt en gång, och sedan inte en enda gång till. Du förstår precis hur den känner det."] },
    { verb: ["ge", "visa"], objekt: "hundkex", mottagare: "grandkatt", gor: ["Katten nosar på hundkexet och tittar på dig med ett djupt förakt för hela din art och, i synnerhet, för hundar."] },

    // Brandstegen och lägenheten
    { verb: "öppna", objekt: "fonster3", gor: [{ utfor: "in" }] },
    { verb: "ta", objekt: "blomkruka", gor: ["Pelargonen har det bättre där den är. Det har ni gemensamt."] },
    { verb: "lyssna", om: { plats: "brandtrappa" }, gor: ["Fasadklockans maskineri tickar bredvid dig, tungt och tålmodigt. Någonstans därinne finns hammaren som slår tretton slag vid midnatt."] },
    { verb: "ta", objekt: ["sang", "kavaj", "grammofon", "piano"], gor: ["Du är här för att hitta noterna, inte för att flytta. Du rör så lite som möjligt. Det är vad en professionell gör. Och en inbrottstjuv."] },
    { verb: "spela", gor: ["Du kan inte spela piano. Du kan knappt spela kort."] },

    // Blå Ostronet: dörrvakten
    { verb: "visa", objekt: "telegram", mottagare: "dorrvakt", om: { inteFlagga: "inslappt" }, gor: [
      { satt: "inslappt" },
      "Sid läser telegrammet med läpparna. Det tar en stund. Sedan tittar han på dig, och för första gången ser han ut att se dig. \"Miss LaRue väntar er. Logen är bakom scenen, dörren med stjärnan.\" Han kliver åt sidan, vilket är ungefär som när ett berg flyttar på sig.",
      { poang: "klubb" },
    ] },
    { verb: "ge", objekt: "telegram", mottagare: "dorrvakt", gor: [{ utfor: "visa telegrammet för dörrvakten" }] },
    { verb: "visa", objekt: "telegram", mottagare: "dorrvakt", gor: ["\"Jag har redan läst det\", säger Sid. \"Det tog lång tid. Jag läser det inte igen.\""] },
    { verb: ["ge", "visa"], mottagare: "dorrvakt", gor: ["Sid tittar på {objekt} utan att röra en muskel. \"Nej.\" Det är inte klart vad han säger nej till. Kanske allt."] },
    { verb: "prata", objekt: "dorrvakt", om: { flagga: "inslappt" }, gor: ["\"Gå in\", säger Sid. \"Ni står i regnet. Det ser illa ut för klubben.\""] },
    { verb: "prata", objekt: "dorrvakt", gor: ["\"Stängt för repetition\", säger Sid. \"Bara personal och artister.\" Han tittar på din rock. \"Ni är ingetdera.\""] },
    { verb: ["ta", "klappa", "slå"], objekt: "dorrvakt", gor: ["Du tittar upp på Sid. Han tittar ner på dig. Du bestämmer dig för något annat."] },

    // Blå Ostronet: salongen
    { verb: "prata", objekt: "pianist", om: { flagga: "bevis" }, gor: ["Pianisten är borta. Bara hans vita handskar ligger kvar på flygeln."] },
    { verb: "prata", objekt: "pianist", gor: ["\"Jag?\" säger pianisten och slår fel ton. \"Jag har varit här hela kvällen. Hela natten. Hela livet.\" Han torkar pannan med en vit handske. \"Freddie Flink, till er tjänst. Jag spelar till Lola ikväll. Om hon hittar sina noter. Vilket hon säkert inte gör. Jag menar, säkert gör.\""] },
    { verb: "visa", objekt: "brev_f", mottagare: "pianist", om: { inteFlagga: "bevis" }, gor: [
      { satt: "bevis" },
      "Du lägger brevet på flygeln. Freddie läser första raden och blir lika vit som sina handskar. Hans fingrar spelar ett ackord av ren skräck. \"Det... det är inte min handstil. Det är min kusins handstil. Han heter också F. Hela familjen heter F.\"",
      "Moe har kommit fram bakom baren utan att någon märkt det. Han lägger en tung hand på Freddies axel och virar sin handduk runt hans handleder. \"Hela familjen kan prata med polisen\", säger Moe. Det är det längsta du har hört honom säga.",
      { poang: "bevis" },
    ] },
    { verb: "visa", objekt: "noter", mottagare: "pianist", gor: ["Freddie ser noterna och slår av ren reflex ett mollackord. \"Var... var hittade ni dem?\" Han ångrar frågan i samma stund som han ställer den."] },
    { verb: ["ge", "visa"], mottagare: "pianist", gor: ["Freddie tittar på {objekt} och svettas lite mer än förut. \"Mycket intressant\", säger han, och spelar vidare. Fel ton igen."] },
    { verb: "lyssna", om: { plats: "klubb" }, gor: ["Pianisten spelar samma åtta takter om och om igen. Vid takt sju tvekar han varje gång, som om han inte riktigt mindes hur den gick. Konstigt, för en pianist."] },
    { verb: "prata", objekt: "bartender", om: { flagga: "bevis" }, gor: ["\"Snyggt jobbat\", säger Moe och torkar glaset. Sedan torkar han det igen. Det är hans sätt att applådera."] },

const MAX = A.maxPoang || Object.values(POANG).reduce((a, p) => a + p[0], 0);
const NYCKEL = A.id || "aventyr";
let S;
function nyttTillstand() {
  const loc = {}, oppen = {};
  for (const [id, o] of Object.entries(OBJ)) { loc[id] = o.plats === undefined ? null : o.plats; if (o.oppen) oppen[id] = true; }
  return { room: A.start, moves: 0, score: 0, loc, f: {}, oppen, scored: {}, over: false, besokt: {}, kortNr: {} };
}

// ---------------------------------------------------------------------------
//  Gränssnittet (byggs av motorn)
// ---------------------------------------------------------------------------
const sk = A.startskarm;
// Bilder kan lånas från ett annat äventyr med A.bildmapp, t.ex. "../annat/bilder/"
const bildvag = p => A.bildmapp && p.startsWith("bilder/") ? A.bildmapp + p.slice(7) : p;
document.title = A.titel;
document.body.insertAdjacentHTML("afterbegin", `
${sk ? `<div class="splash" id="splash" role="button" tabindex="0" aria-label="${esc(A.titel)}. Klicka för att börja spela.">
  <picture>${sk.bildStaende ? `<source media="(orientation: portrait)" srcset="${esc(bildvag(sk.bildStaende))}">` : ""}
    <img src="${esc(bildvag(sk.bild))}" alt="${esc(sk.alt || "")}"></picture>
  ${sk.regn ? `<canvas id="splashregn" aria-hidden="true"></canvas>` : ""}
  <h1 class="logo" id="splashtitel">${sk.ort ? `<span class="ort">${esc(sk.ort)}</span>` : ""}<span class="titel">${esc(sk.titel || A.titel)}</span>${sk.under ? `<span class="under">${esc(sk.under)}</span>` : ""}</h1>
</div>` : ""}
<header class="status"><div class="wrap">
  <span class="title">${esc(A.titel)}</span><span class="where" id="where">–</span><span class="nums" id="nums"></span>
</div></header>
<figure class="scen" id="scen" hidden><canvas id="scenbild" role="img" aria-label="Bild"></canvas></figure>
<main id="scroller"><div class="wrap"><div id="log" aria-live="polite"></div><div id="fyll" aria-hidden="true"></div></div></main>
<footer class="input"><div class="wrap">
  <form id="f" autocomplete="off"><label for="cmd">&gt;</label>
    <input id="cmd" type="text" spellcheck="false" autocapitalize="off" aria-label="Skriv ett kommando" placeholder="${esc(TEXTER.inmatning)}"></form>
  <div class="quick" id="quick">${(A.snabbknappar || [["Titta", "titta"], ["Ägodelar", "inventarie"], ["Upp", "upp"], ["Ner", "ner"], ["In", "in"], ["Ut", "ut"], ["Ledtråd", "ledtråd"], ["Bild", "bild"], ["Ljud", "ljud"], ["Hjälp", "hjälp"]])
    .map(([t, c]) => `<button type="button" data-c="${esc(c)}"${c === "ljud" ? ' id="ljudknapp"' : ""}>${esc(t)}</button>`).join("")}</div>
</div></footer>`);
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const logEl = document.getElementById("log");
const scroller = document.getElementById("scroller");
const fyll = document.getElementById("fyll");
const input = document.getElementById("cmd");
const pekskarm = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
const rorelseOk = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

function out(text, cls) {
  const p = document.createElement("p");
  if (cls) p.className = cls;
  p.textContent = text;
  logEl.appendChild(p);
  return p;
}
function scrollDown() { requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; }); }
function scrollTill(el) {
  requestAnimationFrame(() => {
    if (!el || !el.isConnected) { fyll.style.height = "0px"; scroller.scrollTop = 0; return; }
    const kvar = logEl.getBoundingClientRect().bottom - el.getBoundingClientRect().top;
    fyll.style.height = Math.max(0, scroller.clientHeight - kvar - 12) + "px";
    scroller.scrollTop += el.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 12;
  });
}
let haller = null;
function hallKvar() { if (haller && performance.now() < haller.tills) scrollTill(haller.el); }
window.addEventListener("resize", hallKvar);
if (window.visualViewport) window.visualViewport.addEventListener("resize", hallKvar);
["touchstart", "wheel"].forEach(ev => scroller.addEventListener(ev, () => { haller = null; }, { passive: true }));

// En liten gul pil till höger när det finns mer text att läsa längre ner
const merPil = document.createElement("div");
merPil.id = "merpil"; merPil.hidden = true;
merPil.setAttribute("aria-hidden", "true");   // bara en visuell indikering, går inte att klicka på
merPil.innerHTML = '<svg viewBox="0 0 9 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 0h2v1H0zM7 0h2v1H7zM1 1h2v1H1zM6 1h2v1H6zM2 2h2v1H2zM5 2h2v1H5zM3 3h3v1H3zM4 4h1v1H4z"/></svg>';
document.body.appendChild(merPil);
let pilRaf = 0;
function visaMerPil() {
  if (pilRaf) return;
  pilRaf = requestAnimationFrame(() => {
    pilRaf = 0;
    const kvar = scroller.scrollHeight - scroller.clientHeight - scroller.scrollTop - fyll.offsetHeight;
    const mer = kvar > 24;
    merPil.hidden = !mer;
    if (!mer) return;
    const r = scroller.getBoundingClientRect();
    merPil.style.top = (r.bottom - merPil.offsetHeight) + "px";
    merPil.style.left = r.left + "px";
    merPil.style.width = (Math.min(r.right, window.innerWidth) - r.left) + "px";
  });
}
scroller.addEventListener("scroll", visaMerPil, { passive: true });
window.addEventListener("resize", visaMerPil);
if (window.visualViewport) window.visualViewport.addEventListener("resize", visaMerPil);
new MutationObserver(visaMerPil).observe(logEl, { childList: true, subtree: true, characterData: true });
if (window.ResizeObserver) new ResizeObserver(visaMerPil).observe(scroller);

// ---------------------------------------------------------------------------
//  Textmallar och hjälpfunktioner
// ---------------------------------------------------------------------------
function mall(t, ctx = {}) {
  return String(t).replace(/\{(\w+)\}/g, (m, k) => {
    if (k === "objekt" && ctx.objekt) return OBJ[ctx.objekt].kort;
    if (k === "Objekt" && ctx.objekt) return stor(OBJ[ctx.objekt].kort);
    if (k === "mottagare" && ctx.mottagare) return OBJ[ctx.mottagare].kort;
    if (k === "poang") return S.score;
    if (k === "max") return MAX;
    if (k === "drag") return S.moves;
    return ctx[k] !== undefined ? ctx[k] : m;
  });
}
const stor = t => t.replace(/^./, c => c.toUpperCase());
const valj = v => Array.isArray(v) ? v[S.moves % v.length] : v;
function lista(a) { return a.length <= 1 ? a.join("") : a.slice(0, -1).join(", ") + " " + TEXTER.och + " " + a[a.length - 1]; }
// En text kan vara en sträng eller en lista med delar, där varje del kan ha ett villkor.
function text(v, ctx) {
  if (v == null) return "";
  if (typeof v === "string") return mall(v, ctx);
  if (Array.isArray(v)) return v.map(d => typeof d === "string" ? mall(d, ctx) : (uppfyllt(d.om, ctx) ? mall(d.text, ctx) : "")).join("");
  return uppfyllt(v.om, ctx) ? mall(v.text, ctx) : "";
}

// ---------------------------------------------------------------------------
//  Föremål och var de finns
// ---------------------------------------------------------------------------
const har = id => {
  const l = S.loc[id], o = OBJ[id];
  return l === S.room || (o.grupp && l != null && RUM[S.room].grupp === o.grupp);
};
const bar = id => S.loc[id] === "spelare";
const oppen = id => OBJ[id].oppningsbar ? !!S.oppen[id] : true;
function inom(id) {
  if (har(id) || bar(id)) return true;
  const c = S.loc[id];
  return !!(c && OBJ[c] && OBJ[c].behallare && oppen(c) && inom(c));
}
const iNarheten = () => Object.keys(OBJ).filter(inom);
function hitta(fras) {
  if (!fras) return null;
  const p = " " + fras + " ";
  let basta = null, langd = 0;
  for (const id of iNarheten()) for (const n of OBJ[id].namn) if (p.includes(" " + n + " ") && n.length > langd) { basta = id; langd = n.length; }
  return basta;
}
const kandsIgen = fras => { const p = " " + fras + " "; return Object.values(OBJ).some(o => o.namn.some(n => p.includes(" " + n + " "))); };
function inteHar(fras) {
  if (!fras) return out(TEXTER.sagVad);
  if (kandsIgen(fras)) out(TEXTER.inteHar);
  else out(mall(TEXTER.okantObjekt, { ord: fras.split(" ").pop() }));
}
function gissaPerson() {
  return Object.keys(OBJ).find(id => OBJ[id].person && har(id) && S.loc[id] !== "spelare") || null;
}
function listaInnehall(c) {
  const inne = Object.keys(OBJ).filter(id => S.loc[id] === c);
  out(inne.length ? mall(TEXTER.iDenLigger, { lista: lista(inne.map(id => OBJ[id].kort)) }) : TEXTER.denArTom);
}

// ---------------------------------------------------------------------------
//  Villkor
// ---------------------------------------------------------------------------
const somLista = v => Array.isArray(v) ? v : [v];
function uppfyllt(om, ctx = {}) {
  if (!om) return true;
  if (Array.isArray(om)) return om.every(o => uppfyllt(o, ctx));
  for (const [k, v] of Object.entries(om)) {
    let ok;
    switch (k) {
      case "flagga": ok = somLista(v).every(f => S.f[f]); break;
      case "inteFlagga": ok = somLista(v).every(f => !S.f[f]); break;
      case "bar": ok = somLista(v).every(bar); break;
      case "inteBar": ok = somLista(v).every(id => !bar(id)); break;
      case "har": ok = somLista(v).every(har); break;
      case "inteHar": ok = somLista(v).every(id => !har(id)); break;
      case "inom": ok = somLista(v).every(inom); break;
      case "inteInom": ok = somLista(v).every(id => !inom(id)); break;
      case "plats": ok = somLista(v).includes(S.room); break;
      case "intePlats": ok = !somLista(v).includes(S.room); break;
      case "objektPa": ok = S.loc[v[0]] === v[1]; break;
      case "inteObjektPa": ok = S.loc[v[0]] !== v[1]; break;
      case "oppen": ok = !!S.oppen[v]; break;
      case "stangd": ok = !S.oppen[v]; break;
      case "inventarieTom": ok = !Object.keys(OBJ).some(bar) === v; break;
      case "objekt": ok = somLista(v).includes(ctx.objekt); break;
      case "mottagare": ok = somLista(v).includes(ctx.mottagare); break;
      case "fras": ok = !!ctx.fras === v; break;
      case "ord": ok = somLista(v).some(o => (" " + (ctx.fras || "") + " ").includes(" " + o + " ") || (o.endsWith("*") && (ctx.fras || "").includes(o.slice(0, -1)))); break;
      case "inteOrd": ok = !uppfyllt({ ord: v }, ctx); break;
      case "franGrupp": ok = !!ctx.fran && RUM[ctx.fran].grupp === v; break;
      case "inteFranGrupp": ok = !ctx.fran || RUM[ctx.fran].grupp !== v; break;
      case "fran": ok = somLista(v).includes(ctx.fran); break;
      case "poangMinst": ok = S.score >= v; break;
      case "alla": ok = v.every(o => uppfyllt(o, ctx)); break;
      case "nagon": ok = v.some(o => uppfyllt(o, ctx)); break;
      case "inte": ok = !uppfyllt(v, ctx); break;
      default: console.warn("Okänt villkor", k); ok = false;
    }
    if (!ok) return false;
  }
  return true;
}

// ---------------------------------------------------------------------------
//  Handlingar
// ---------------------------------------------------------------------------
let ljudFordrojning = 0;     // väntar med poängljudet tills en längre effekt har spelat klart
let spelOmgang = 0;          // ökar vid omstart, så att gamla repliker inte skriver vidare
let nyScen = false;          // sätts när en platsbeskrivning skrivs ut
let stoppaRorelse = false;   // sätts av en spärr som hindrar förflyttning
let raknaDrag = true;

function gor(handlingar, ctx = {}) {
  for (const h of somLista(handlingar || [])) {
    if (typeof h === "string") { out(mall(h, ctx)); continue; }
    if (h.om && !uppfyllt(h.om, ctx)) continue;
    if (h.text !== undefined) { const t = text(h.text, ctx); if (t) out(t); }
    if (h.texter) out(mall(valj(h.texter), ctx));
    if (h.sys) out(mall(h.sys, ctx), "sys");
    if (h.stampel) out(h.stampel, "stamp");
    if (h.flytta) somLista(h.flytta).forEach(id => { S.loc[id] = h.till === "här" ? S.room : h.till === undefined ? null : h.till; });
    if (h.satt) somLista(h.satt).forEach(f => { S.f[f] = true; });
    if (h.nollstall) somLista(h.nollstall).forEach(f => { delete S.f[f]; });
    if (h.oppna) S.oppen[h.oppna] = true;
    if (h.stang) delete S.oppen[h.stang];
    if (h.lista) listaInnehall(h.lista);
    if (h.ljudFordrojning !== undefined) ljudFordrojning = h.ljudFordrojning;
    if (h.ljud) Ljud.effekt(h.ljud, h.fordrojning || 0);
    if (h.poang) belona(h.poang);
    if (h.ejDrag) raknaDrag = false;
    if (h.ledtrad) ledtrad();
    if (h.beskriv) titta();
    if (h.flyttaSpelare) S.room = h.flyttaSpelare;
    if (h.ga) { S.room = h.ga; titta(true); vidIntrade(); }
    if (h.utfor) utfor(mall(h.utfor, ctx), true);
    if (h.kor) gor(A.handlingar[h.kor], ctx);
    if (h.replik) replik(h);
    if (h.samtal) startaSamtal(h.samtal, h.nod);
    if (h.avslutaSamtal) avslutaSamtal();
    if (h.slutsummering) out(mall(TEXTER.slutsummering));
    if (h.spelSlut) { S.over = true; uppdateraStatus(); }
    if (h.stopp) stoppaRorelse = true;
  }
}
function belona(nyckel) {
  if (S.scored[nyckel] || !POANG[nyckel]) return;
  S.scored[nyckel] = true;
  S.score += POANG[nyckel][0];
  if (ljudFordrojning >= 0) Ljud.effekt("poang", ljudFordrojning);
  out(mall(TEXTER.poangOkade, { n: POANG[nyckel][0] }), "score");
}

// Regler: { verb, objekt, mottagare, om, gor, nar }. Första regeln som passar används.
function provaRegler(ctx, nar = "fore") {
  let traff = false;
  for (const r of A.regler || []) {
    if ((r.nar || "fore") !== nar) continue;
    if (!somLista(r.verb).includes(ctx.verb)) continue;
    if (r.objekt !== undefined && !somLista(r.objekt).includes(ctx.objekt)) continue;
    if (r.mottagare !== undefined && !somLista(r.mottagare).includes(ctx.mottagare)) continue;
    if (!uppfyllt(r.om, ctx)) continue;
    gor(r.gor, ctx);
    traff = true;
    if (nar === "fore") return true;
  }
  return traff;
}

// ---------------------------------------------------------------------------
//  Rum och förflyttning
// ---------------------------------------------------------------------------
// Kort beskrivning vid återbesök. rum.kortBeskrivning är en sträng eller en lista där varje
// del är en sträng eller { om, text }. Delar med villkor som stämmer går före delar utan villkor,
// och bland dem som passar växlar motorn i tur och ordning.
function kortBeskrivning(r) {
  const alla = somLista(r.kortBeskrivning).map(d => typeof d === "string" ? { text: d } : d);
  const passar = alla.filter(d => d.om && uppfyllt(d.om));
  const val = passar.length ? passar : alla.filter(d => !d.om);
  if (!val.length) return null;
  const nr = S.kortNr[S.room] || 0;
  S.kortNr[S.room] = nr + 1;
  return text(val[nr % val.length].text);
}
// vidAnkomst: spelaren har just kommit hit. Har platsen besökts förut och har en kort
// beskrivning visas den. Annars, och när spelaren själv tittar, visas hela beskrivningen.
function titta(vidAnkomst = false) {
  nyScen = true;
  S.besokt = S.besokt || {}; S.kortNr = S.kortNr || {};
  const r = RUM[S.room];
  out(r.namn, "room");
  const kort = vidAnkomst && S.besokt[S.room] && r.kortBeskrivning ? kortBeskrivning(r) : null;
  out(kort || text(r.beskrivning));
  S.besokt[S.room] = true;
  const saker = Object.keys(OBJ).filter(id => har(id) && !OBJ[id].fast && !OBJ[id].person);
  if (saker.length) out(mall(TEXTER.harFinns, { lista: lista(saker.map(id => OBJ[id].kort)) }));
  uppdateraStatus();
}
function vidIntrade() {
  const r = RUM[S.room];
  for (const regel of r.vidIntrade || []) {
    if (!uppfyllt(regel.om)) continue;
    gor(regel.gor);
    if (regel.stopp !== false) break;
  }
}
function ga(dir) {
  const fran = S.room, till = RUM[fran].utgangar[dir];
  if (!till) { out(valj(TEXTER.ingenUtgang)); return; }
  stoppaRorelse = false;
  // passage kan vara en lista med regler eller namnet på en gemensam lista i A.passager
  const passage = typeof RUM[till].passage === "string" ? (A.passager || {})[RUM[till].passage] : RUM[till].passage;
  for (const regel of passage || []) {
    if (!uppfyllt(regel.om, { fran })) continue;
    gor(regel.gor, { fran });
    if (regel.stopp) return;
  }
  S.room = till;
  titta(true);
  vidIntrade();
}
// "gå till restaurangen": hitta en utgång som leder till ett rum med något av orden
function gaTill(ord) {
  const d = ord.find(x => RIKTNINGAR[x]);
  if (d) return ga(RIKTNINGAR[d]);
  const fras = " " + ord.join(" ") + " ";
  for (const [dir, till] of Object.entries(RUM[S.room].utgangar)) {
    const ord = (RUM[till].ord || []).concat([RUM[till].namn.toLowerCase()]);
    if (ord.some(o => fras.includes(" " + o + " "))) return ga(dir);
  }
  out(TEXTER.gaVart);
}

// Resor mellan stationer (t.ex. tunnelbana), om äventyret har det
function resa(fras) {
  const R = A.resor, T = R.texter;
  if (!R.stationer[S.room]) {
    const ner = RUM[S.room].utgangar.ner;
    out(ner && R.stationer[ner] ? T.forstNer : T.ingenStation);
    return;
  }
  if (!fras) { out(T.vart); return; }
  const p = " " + fras + " ";
  const mal = Object.keys(R.stationer).find(id => R.stationer[id].ord.some(w => p.includes(" " + w + " ")));
  if (!mal) { out(T.okand); return; }
  if (mal === S.room) { out(T.redanHar); return; }
  out(valj(R.resetexter));
  if (R.ljud) Ljud.effekt(R.ljud);
  out(mall(T.avstigning, { station: R.stationer[mal].namn }), "sys");
  S.room = mal;
  titta(true);
}

// ---------------------------------------------------------------------------
//  Verb
// ---------------------------------------------------------------------------
function rensa(ord) { return ord.filter(w => !UTFYLLNAD.has(w)).join(" ").trim(); }
function delaVid(ord, prep) {
  const i = ord.findIndex(w => prep.includes(w));
  if (i < 0) return [rensa(ord), ""];
  return [rensa(ord.slice(0, i)), rensa(ord.slice(i + 1))];
}
// Kör regler för ett verb, annars standardbeteendet. Därefter eventuella "efter"-regler.
function verb(ctx, standard) {
  if (provaRegler(ctx)) return;
  standard();
  provaRegler(ctx, "efter");
}
const V = {
  titta(ord) {
    if (ord[0] === "på") return V.undersök(ord.slice(1));
    if (ord[0] === "i" || ord[0] === "under") return V.sök(ord.slice(1));
    if (rensa(ord)) return V.undersök(ord);
    verb({ verb: "titta" }, titta);
  },
  undersök(ord) {
    const fras = rensa(ord);
    if (!fras) return titta();
    const id = hitta(fras);
    if (!id) return inteHar(fras);
    verb({ verb: "undersök", objekt: id, fras }, () => {
      out(text(OBJ[id].beskrivning, { objekt: id }));
      if (OBJ[id].behallare && OBJ[id].oppningsbar && oppen(id)) listaInnehall(id);
    });
  },
  sök(ord) {
    const fras = rensa(ord.filter(x => !["i", "igenom", "genom", "efter", "på"].includes(x)));
    const id = hitta(fras);
    if (!id) return out(TEXTER.letarRunt);
    verb({ verb: "sök", objekt: id, fras }, () => {
      if (OBJ[id].behallare) { if (!oppen(id)) out(OBJ[id].stangdText || TEXTER.stangd); else listaInnehall(id); }
      else V.undersök([fras]);
    });
  },
  ta(ord) {
    const fras = rensa(ord.filter(x => x !== "upp"));
    if (/\b(allt|alla|allting)\b/.test(fras)) {
      const saker = iNarheten().filter(id => !bar(id) && !OBJ[id].fast && !OBJ[id].person);
      if (!saker.length) return out(TEXTER.taIngetAtt);
      saker.forEach(id => { out(mall(TEXTER.tagetLista, { objekt: id })); gor(OBJ[id].vidTa, { objekt: id }); S.loc[id] = "spelare"; });
      return;
    }
    const id = hitta(fras);
    if (!id) return inteHar(fras);
    if (bar(id)) return out(TEXTER.redanBuren);
    verb({ verb: "ta", objekt: id, fras }, () => {
      if (OBJ[id].person) return out(TEXTER.taPerson);
      if (OBJ[id].fast) return out(TEXTER.taFast);
      out(TEXTER.taget);
      gor(OBJ[id].vidTa, { objekt: id });
      S.loc[id] = "spelare";
    });
  },
  "ta på"(ord) {
    const fras = rensa(ord), id = hitta(fras);
    verb({ verb: "ta på", objekt: id, fras }, () => out(TEXTER.taPaSig));
  },
  släpp(ord) {
    let r = rensa(ord); if (r.startsWith("ner ")) r = r.slice(4);
    const fras = delaVid(r.split(" "), ["i", "på"])[0];
    const id = hitta(fras);
    if (!id) return inteHar(fras);
    if (!bar(id)) return out(TEXTER.harInte);
    verb({ verb: "släpp", objekt: id, fras }, () => { S.loc[id] = S.room; out(TEXTER.slappt); });
  },
  inventarie() {
    verb({ verb: "inventarie" }, () => {

// intern = kommandot kommer från en regel (t.ex. "öppna skrivbordet" som öppnar lådan) och räknas inte som ett nytt drag.
function utfor(rad, intern = false) {
  let s = rad.toLowerCase().replace(/[.,!?;:"'()]/g, " ").replace(/\s+/g, " ").trim();
  if (!s) return out(TEXTER.tomtKommando);
  if (A.alias) for (const [fran, till] of Object.entries(A.alias)) if (s === fran || s.startsWith(fran + " ")) s = till + s.slice(fran.length);
  const w = s.split(" ");
  // Metakommandon räknas inte som drag
  if (!intern) {
    for (const [m, ord] of Object.entries(META)) if (ord.includes(w[0]) || ord.includes(s)) return meta(m);
    if (S.over) return out(TEXTER.spelSlut, "sys");
    S.moves++;
    raknaDrag = true;
  }
  if (RIKTNINGAR[w[0]] && w.length === 1) return ga(RIKTNINGAR[w[0]]);
  // Verb på två ord först (t.ex. "ta på", "lås upp"), sedan ett ord
  let kanon = VERB[w[0] + " " + w[1]], resten = w.slice(2);
  if (!kanon) { kanon = VERB[w[0]]; resten = w.slice(1); }
  if (kanon) {
    if (V[kanon]) V[kanon](resten, s);
    else egetVerb(kanon, resten);
    if (!raknaDrag && !intern) { S.moves--; raknaDrag = true; }
    return;
  }
  if (!intern) S.moves--;
  out(mall(TEXTER.okantOrd, { ord: w[0] }));
}

      if (klicklage) { TEXTER.hjalpKlick.forEach(t => out(t)); return; }
      TEXTER.hjalp.forEach(t => out(t)); out(TEXTER.hjalpOvrigt, "sys"); return;
    case "ledtråd": return ledtrad();
    case "poäng": return poangRapport();
    case "spara": return spara();
    case "ladda": return ladda();
    case "bild": return vaxlaBilder();
    case "ljud": { const pa = Ljud.vaxlaLjud(); visaLjudknapp(); return out(pa ? TEXTER.ljudPa : TEXTER.ljudAv, "sys"); }
    case "musik": { const pa = Ljud.vaxlaMusik(); return out(pa ? TEXTER.musikPa : TEXTER.musikAv, "sys"); }

}

// ---------------------------------------------------------------------------
//  Repliker: orden skrivs ut i takt med rösten
// ---------------------------------------------------------------------------
function replik(h) {
  const el = out("", "replik pratar");
  const omgang = spelOmgang;
  const delar = (D.texttider || {})[h.replik] || [];
  if (!delar.length) { el.textContent = "””"; gor(h.sedan); return; }
  const ord = [];
  for (const [t0, t1, mening] of delar) {
    let acc = 0;
    for (const o of mening.split(" ")) { ord.push([t0 + (t1 - t0) * acc / mening.length, o]); acc += o.length + 1; }
  }
  const slut = delar[delar.length - 1][1] + 0.4;
  Ljud.effekt(h.ljud || h.replik).then(f => {
    const t0 = performance.now() + (f == null ? -(delar[0][0] - 0.4) : f) * 1000;
    let i = 0;
    const steg = () => {
      if (omgang !== spelOmgang) return;
      const t = (performance.now() - t0) / 1000;
      let nytt = false;
      while (i < ord.length && ord[i][0] <= t) { i++; nytt = true; }
      if (nytt) {
        el.textContent = "”" + ord.slice(0, i).map(o => o[1]).join(" ") + (i === ord.length ? "”" : "");
        if (!pekskarm) scroller.scrollTop = scroller.scrollHeight;
      }
      if (t >= slut) {
        el.classList.remove("pratar");
        ljudFordrojning = 0;
        gor(h.sedan);
        uppdateraStatus();
        if (!pekskarm) scrollDown();
        return;
      }
      setTimeout(steg, 40);
    };
    steg();
  });
}

// ---------------------------------------------------------------------------
//  Bilder och animationer
// ---------------------------------------------------------------------------
const BD = D.bilder || { palett: [], bilder: {} };
const BREDD = BD.bredd || 192, HOJD = BD.hojd || 120;
const FARG = BD.palett.map(([r, g, b]) => `rgb(${r},${g},${b})`);
for (const anims of Object.values(BD.bilder)) {
  for (const a of anims) {
    a.ramar = a.ramar.map(str => {
      if (typeof str !== "string") return str;
      const bin = atob(str), ut = new Uint16Array(bin.length);
      for (let i = 0; i < bin.length; i += 3) {
        const pos = (bin.charCodeAt(i) << 8) | bin.charCodeAt(i + 1);
        ut[i] = pos % BREDD; ut[i + 1] = Math.floor(pos / BREDD); ut[i + 2] = bin.charCodeAt(i + 2);
      }
      return ut;
    });
  }
}
const cv = document.getElementById("scenbild");
cv.width = BREDD; cv.height = HOJD;
const scen = { namn: null, bas: null, klar: false, start: 0, senaste: "", raf: 0 };
const BILD_KEY = NYCKEL + "-bilder";
let visaBilder = true;
try { visaBilder = localStorage.getItem(BILD_KEY) !== "av"; } catch (e) {}

function uppdateraScen() {
  const fig = document.getElementById("scen");
  const namn = RUM[S.room].bild;
  if (!namn || !visaBilder) { fig.hidden = true; stoppaAnim(); scen.namn = null; return; }
  fig.hidden = false;
  anpassaScen();
  if (scen.namn !== namn) {
    scen.namn = namn; scen.klar = false; scen.senaste = "";
    cv.setAttribute("aria-label", "Bild: " + RUM[S.room].namn);
    cv.dataset.bild = namn;   // för automatiska tester
    const img = new Image();
    img.onload = () => {
      if (scen.namn !== namn) return;
      scen.bas = img; scen.klar = true; scen.start = performance.now();
      ritaScen(true); startaAnim();
    };
    img.src = bildvag("bilder/" + namn + ".png");
    cv.classList.remove("ritar"); void cv.offsetWidth; cv.classList.add("ritar");
  } else { ritaScen(true); startaAnim(); }
}
function ramIndex(anim, t) {
  const n = anim.slinga || anim.ms.length;
  let r = t % anim.ms.slice(0, n).reduce((a, b) => a + b, 0);
  for (let i = 0; i < n; i++) { if (r < anim.ms[i]) return i; r -= anim.ms[i]; }
  return 0;
}
// Rummets "animationer" kan låsa en animation på en viss ruta: { namn: [{ om, ram }] }
function lastRam(namn) {
  const regler = (RUM[S.room].animationer || {})[namn];
  if (!regler) return null;
  const r = regler.find(x => uppfyllt(x.om));
  return r ? r.ram : null;
}
function ritaScen(tvinga) {
  if (!scen.klar) return;
  const anims = BD.bilder[scen.namn] || [];
  const t = performance.now() - scen.start;
  const val = anims.map(a => {
    const fast = lastRam(a.namn);
    if (fast !== null && fast !== undefined) return fast;
    return rorelseOk ? ramIndex(a, t) : -1;
  });
  const nyckel = val.join(",");
  if (!tvinga && nyckel === scen.senaste) return;
  scen.senaste = nyckel;
  const ctx = cv.getContext("2d");
  ctx.drawImage(scen.bas, 0, 0);
  anims.forEach((a, i) => {
    if (val[i] < 0) return;
    const p = a.ramar[val[i]];
    for (let k = 0; k < p.length; k += 3) { ctx.fillStyle = FARG[p[k + 2]]; ctx.fillRect(p[k], p[k + 1], 1, 1); }
  });
}
function startaAnim() {
  if (scen.raf || !rorelseOk) return;
  const loop = () => { ritaScen(); scen.raf = requestAnimationFrame(loop); };
  scen.raf = requestAnimationFrame(loop);
}
function stoppaAnim() { cancelAnimationFrame(scen.raf); scen.raf = 0; }
// Heltalsskalning så att alla pixlar blir lika stora. På mobil i stående läge fyller bilden bredden.
function anpassaScen() {
  const vw = document.documentElement.clientWidth || window.innerWidth;
  if (vw < 700 && window.innerHeight > window.innerWidth) {
    cv.style.width = vw + "px";
    cv.style.height = Math.round(vw * HOJD / BREDD) + "px";
    return;
  }
  const maxW = Math.min(window.innerWidth, 1200), maxH = window.innerHeight * 0.36;
  let k = Math.floor(Math.min(maxW / BREDD, maxH / HOJD));
  if (k < 1) k = 1;
  if (k < 2 && maxW >= BREDD * 2) k = 2;
  cv.style.width = BREDD * k + "px";
  cv.style.height = HOJD * k + "px";
}
window.addEventListener("resize", anpassaScen);
function vaxlaBilder() {
  visaBilder = !visaBilder;
  try { localStorage.setItem(BILD_KEY, visaBilder ? "pa" : "av"); } catch (e) {}
  out(visaBilder ? TEXTER.bilderPa : TEXTER.bilderAv, "sys");
  uppdateraScen();
}

// ---------------------------------------------------------------------------
//  Ljud: musik, miljöljud och effekter (filer i ljud/, spelas med Web Audio)
// ---------------------------------------------------------------------------
const Ljud = (() => {
  const L = A.ljud || {};
  const KEY = NYCKEL + "-ljud-v2";
  const inst = { ljud: true, musik: true };
  try { Object.assign(inst, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const sparaInst = () => { try { localStorage.setItem(KEY, JSON.stringify(inst)); } catch (e) {} };
  const AC = window.AudioContext || window.webkitAudioContext;
  const MUSIKNIVA = L.musikniva || 0.42;
  const MILJO = L.miljo || {};
  const EFFEKTVOLYM = L.effektvolym || {};
  const SLINGOR = D.slingor || {};
  let ctx = null, master, musikBus, miljoBus, sfxBus;
  let rum = null, lager = [], handelser = [], musikKalla = null;
  const buffertar = {}, langder = {};
  const slump = (a, b) => a + Math.random() * (b - a);
  function bygg() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = inst.ljud ? 1 : 0; master.connect(ctx.destination);
    musikBus = ctx.createGain(); musikBus.gain.value = 0; musikBus.connect(master);
    miljoBus = ctx.createGain(); miljoBus.gain.value = 0.85; miljoBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
  }
  function ladda(namn) {
    if (!buffertar[namn]) {
      buffertar[namn] = fetch(D.ljudfiler ? (D.ljudfiler[namn] || "ljud/" + namn + ".mp3") : (A.ljudmapp || "ljud/") + namn + ".mp3")
        .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(data => new Promise((ok, fel) => ctx.decodeAudioData(data, ok, fel)))
        .then(buf => { langder[namn] = buf.duration; return buf; })
        .catch(() => null);
    }
    return buffertar[namn];
  }
  // mp3 kan ha lite tystnad i början; loopa exakt den längd generatorn angav.
  function slingpunkter(buf, namn) {
    const n44 = SLINGOR[namn] || 0;
    if (!n44) return [0, buf.duration];
    const n = Math.round(n44 * buf.sampleRate / 44100);
    if (buf.length < n) return [0, buf.duration];
    const d = buf.getChannelData(0);
    let start = 0;
    const max = Math.min(buf.length - n, 4096);
    while (start < max && Math.abs(d[start]) < 1e-4) start++;
    return [start / buf.sampleRate, (start + n) / buf.sampleRate];
  }
  function spelaSlinga(namn, buss, vol, fadein = 1.2) {
    const g = ctx.createGain(); g.gain.value = 0; g.connect(buss);
    const post = { g, kalla: null, stoppad: false };
    ladda(namn).then(buf => {
      if (!buf || post.stoppad) return;
      const s = ctx.createBufferSource();
      s.buffer = buf; s.loop = true;
      const [a, b] = slingpunkter(buf, namn);
      s.loopStart = a; s.loopEnd = b;
      s.connect(g);
      s.start(ctx.currentTime + 0.05, a + (buss === musikBus ? 0 : Math.random() * Math.max(0, b - a - 1)));
      g.gain.setTargetAtTime(vol, ctx.currentTime, fadein / 3);
      post.kalla = s;
    });
    return post;
  }
  function stoppaSlinga(post, fadeut = 1.2) {
    post.stoppad = true;
    const nu = ctx.currentTime;
    post.g.gain.cancelScheduledValues(nu);
    post.g.gain.setTargetAtTime(0, nu, fadeut / 3);
    if (post.kalla) post.kalla.stop(nu + fadeut + 0.5);
  }
  function spelaEn(namn, vid, vol, buss = sfxBus) {
    return ladda(namn).then(buf => {
      if (!buf) return null;
      const s = ctx.createBufferSource(), g = ctx.createGain();
      s.buffer = buf; g.gain.value = vol;
      s.connect(g); g.connect(buss);
      const nar = Math.max(ctx.currentTime + 0.02, vid);
      s.start(nar);
      return nar;
    });
  }
  const musikNiva = () => !inst.musik ? 0 : (MILJO[rum] && MILJO[rum].dampaMusik ? MUSIKNIVA * 0.15 : MUSIKNIVA);
  function startaMusik() {
    if (!L.musik) return;
    if (!musikKalla) musikKalla = spelaSlinga(L.musik, musikBus, 1, 0.5);
    musikBus.gain.setTargetAtTime(musikNiva(), ctx.currentTime, 0.8);
  }
  function bytMiljo(id) {
    if (id === rum) return;
    rum = id;
    lager.forEach(l => stoppaSlinga(l));
    const m = MILJO[id] || {};
    lager = (m.slingor || []).map(([namn, vol]) => spelaSlinga(namn, miljoBus, vol));

// Långa titlar krymps så att de får plats i bredden (t.ex. på en smal mobil)
function anpassaTitel() {
  const t = document.querySelector("#splashtitel .titel");
  if (!t) return;
  t.style.fontSize = "";
  const max = Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth) * 0.92;
  let fs = parseFloat(getComputedStyle(t).fontSize);
  for (let i = 0; i < 40 && t.scrollWidth > max && fs > 12; i++) { fs *= 0.95; t.style.fontSize = fs + "px"; }
}
function visaStartskarm() {
  const sp = document.getElementById("splash");
  startskarmVisas = true;
  anpassaTitel();
  window.addEventListener("resize", anpassaTitel);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(anpassaTitel);
  let stangd = false, raf = 0;
  const cvr = document.getElementById("splashregn");
  if (cvr && rorelseOk && cvr.getContext) {
    const c = cvr.getContext("2d");
    const droppar = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), v: 0.6 + Math.random() * 0.8, l: 0.02 + Math.random() * 0.03 }));
    let senast = performance.now();
    const rita = nu => {
      const dt = Math.min(0.05, (nu - senast) / 1000); senast = nu;
      const dpr = window.devicePixelRatio || 1;
      const w = cvr.width = cvr.clientWidth * dpr, h = cvr.height = cvr.clientHeight * dpr;
      c.clearRect(0, 0, w, h);
      c.strokeStyle = "rgba(210, 205, 195, 0.22)"; c.lineWidth = Math.max(1, dpr * 0.8);
      c.beginPath();
      for (const d of droppar) {
        d.y += d.v * dt * 1.6; d.x -= d.v * dt * 0.25;
        if (d.y > 1.05) { d.y = -0.05; d.x = Math.random() * 1.1; }
        c.moveTo(d.x * w, d.y * h); c.lineTo((d.x - d.l * 0.2) * w, (d.y + d.l) * h);
      }
      c.stroke();
      raf = requestAnimationFrame(rita);
    };
    raf = requestAnimationFrame(rita);
  }
  const stang = () => {
    if (stangd) return;
    stangd = true; startskarmVisas = false;
    Ljud.vakna();
    sp.classList.add("borta");
    setTimeout(() => { sp.hidden = true; cancelAnimationFrame(raf); }, 950);
    if (!pekskarm) input.focus();
  };
  // Bilden ligger kvar tills man klickar på den. Klicket startar också musiken.
  sp.addEventListener("click", stang);

}

// ---------------------------------------------------------------------------
//  Samtal: personer som man pratar med genom att välja vad man svarar
//  A.samtal = { id: { start: "nod", noder: { nod: { text, gor, val: [{ text, om, engang, gor, till }] } } } }
//  Handlingen { samtal: "id" } (eller { samtal: "id", nod: "nod" }) startar ett samtal. Ett val utan
//  "till" avslutar samtalet. Svaren visas som knappar, och i textläget också som en numrerad lista.
// ---------------------------------------------------------------------------

const samtalsNod = () => S.samtal && A.samtal && A.samtal[S.samtal.id] && A.samtal[S.samtal.id].noder[S.samtal.nod];

const valNyckel = (kalla, i) => S.samtal.id + "/" + kalla + "/" + i;
function samtalsAlternativ() {
  const n = samtalsNod();
  if (!n) return [];
  S.valda = S.valda || {};
  const kalla = typeof n.val === "string" ? n.val : S.samtal.nod;
  const lista = typeof n.val === "string" ? (A.samtal[S.samtal.id].noder[n.val] || {}).val : n.val;
  return (lista || []).map((v, i) => ({ v, i, kalla })).filter(({ v, i }) => (!v.om || uppfyllt(v.om)) && !(v.engang && S.valda[valNyckel(kalla, i)]));
}
function startaSamtal(id, nod) {

}
function visaNod() {

  if (n.text !== undefined) { const t = text(n.text); if (t) out(t); }
  if (n.gor) gor(n.gor);
  if (S.samtal !== dettaSamtal) return;          // handlingarna startade eller avslutade ett samtal
  const alt = samtalsAlternativ();

  ritaSamtalsval();
}
function avslutaSamtal() { S.samtal = null; ritaSamtalsval(); }
function ritaSamtalsval() {
  const alt = S && S.samtal ? samtalsAlternativ() : [];
  samtalsval.innerHTML = "";

    b.type = "button"; b.textContent = (klicklage ? "" : (k + 1) + ". ") + a.v.text;
    b.addEventListener("click", e => { e.stopPropagation(); valjSvar(k); if (pekskarm) b.blur(); });

function valjSvar(k) {
  const a = samtalsAlternativ()[k];
  if (!a) return;
  fyll.style.height = "0px";
  ljudFordrojning = 0;
  nyScen = false;
  const rad = out(a.v.text, "cmd");
  if (a.v.engang) S.valda[valNyckel(a.kalla, a.i)] = true;
  const nasta = a.v.till ? { id: S.samtal.id, nod: a.v.till } : null;
  S.samtal = nasta;
  gor(a.v.gor || []);
  if (nasta && S.samtal === nasta) visaNod(); else ritaSamtalsval();

// ---------------------------------------------------------------------------
//  Inmatning och start
// ---------------------------------------------------------------------------
const historik = []; let hIdx = 0;
function rullaTill(rad) {
  if (pekskarm || nyScen) { scrollTill(rad); haller = { el: rad, tills: performance.now() + 1200 }; }
  else scrollDown();
}
function skicka(t) {
  t = t.trim();
  if (!t) return;
  if (S.samtal) {
    // I textläget väljer en siffra ett svar. Allt annat avslutar samtalet.
    if (/^\d+$/.test(t)) { valjSvar(+t - 1); historik.push(t); hIdx = historik.length; return; }
    avslutaSamtal();
  }
  fyll.style.height = "0px";
  ljudFordrojning = 0;
  const rad = out(t, "cmd");
  historik.push(t); hIdx = historik.length;
  nyScen = false;
  utfor(t);
  uppdateraStatus();
  rullaTill(rad);
}

  if (e.key === "ArrowUp" && hIdx > 0) { hIdx--; input.value = historik[hIdx]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { hIdx = Math.min(historik.length, hIdx + 1); input.value = historik[hIdx] || ""; e.preventDefault(); }
});
document.getElementById("quick")?.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) { skicka(b.dataset.c); if (pekskarm) b.blur(); else input.focus(); }
});

function start(data) {
  visaLjudknapp();
  const medStartskarm = !!sk && !(data && data.state);
  if (medStartskarm) visaStartskarm();
  else if (sk) document.getElementById("splash").hidden = true;
  const pagar = data && data.state ? null : pagaendeSpel();
  if (data && data.state) { S = data.state; out(TEXTER.tillbaka, "sys"); titta(); }
  else if (pagar && pagar.moves > 0) {
    S = pagar;
    const banner = (A.intro || []).find(d => d && d.klass === "banner");
    if (banner) out(banner.text, "banner");
    out(TEXTER.fortsatter, "sys");
    titta();
  }
  else { S = nyttTillstand(); intro(); }
  autosparaPa = true;
  uppdateraStatus();
  scrollTill(null);
  window.claude?.hot?.snapshot?.(() => ({ state: S }));
  if (!pekskarm && !medStartskarm) input.focus();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

// För tester och felsökning
window.Spelmotor = { utfor: t => { utfor(t); uppdateraStatus(); }, skicka, samtal: (id, nod) => { startaSamtal(id, nod); uppdateraStatus(); }, get tillstand() { return S; }, Ljud };
window.Ljud = Ljud;
}
// Starta när sidan är redo (skripten kan ligga i <head> eller sist i <body>)
if (document.body) startaSpelmotorn();
else document.addEventListener("DOMContentLoaded", startaSpelmotorn);
