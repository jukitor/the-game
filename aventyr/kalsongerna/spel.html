<title>Borgmästarens långkalsonger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Spelmotorns utseende. Gemensamt för alla äventyr. */

/* Layout: en arkivmapp för ett fall. Statusrad överst, maskinskrivet protokoll i mitten, inmatningsrad längst ner. */
:root {
  --bg: #e6dbbd;       /* manilamapp */
  --paper: #f4eedc;    /* papper */
  --ink: #2a251d;      /* skrivmaskinsbläck */
  --muted: #6e6552;
  --stamp: #a8281f;    /* stämpelrött */
  --rule: #cdbf98;
  --pil: #c48b00; --pilskugga: rgba(42, 37, 29, .35);   /* pilen för mer text */
  --font-type: "Courier Prime", "Courier New", Courier, monospace;
  --font-head: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141922; --paper: #1c2330; --ink: #e5e0d2; --muted: #8e95a3; --stamp: #ff7c6c; --rule: #2e3746;
    --pil: #f2c230; --pilskugga: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141922; --paper: #1c2330; --ink: #e5e0d2; --muted: #8e95a3; --stamp: #ff7c6c; --rule: #2e3746;
    --pil: #f2c230; --pilskugga: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-type); font-size: 16px; line-height: 1.55;
  display: flex; flex-direction: column;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  width: 100%; max-width: 46rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.status {
  border-bottom: 2px solid var(--ink);
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .06em;
}
header.status .wrap {
  display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between;
  padding-block: 10px 8px;
}
.status .title { font-weight: 600; font-size: 1.05rem; color: var(--stamp); }
.status .where { font-weight: 500; font-size: 1rem; flex: 1 1 auto; min-width: 0; }
.status .nums { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
main {
  flex: 1 1 auto; overflow-y: auto; min-height: 0;
}
#log { padding-block: 20px 12px; display: flex; flex-direction: column; gap: 12px; }
#log p { margin: 0; max-width: 65ch; white-space: pre-wrap; overflow-wrap: anywhere; }
#log .cmd { color: var(--muted); }
#log .cmd::before { content: "> "; }
#log .room { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: 1.05rem; margin-top: 6px; }
#log .sys { color: var(--muted); font-style: italic; }
#log .stamp {
  align-self: flex-start; color: var(--stamp); border: 3px double var(--stamp);
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .12em; font-weight: 600;
  padding: 4px 12px; transform: rotate(-2deg); margin-block: 4px;
}
#log .banner {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .1em;
  font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.05; font-weight: 600; text-wrap: balance;
}
#log .score { color: var(--stamp); font-weight: 700; }
#log .replik { color: var(--stamp); font-style: italic; }
#log .replik.pratar::after { content: "\258C"; font-style: normal; animation: markor 1s steps(1) infinite; margin-left: 2px; }
@keyframes markor { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #log .replik.pratar::after { animation: none; } }
/* Startskärmen: en filmaffisch med bilden i fullskärm, loggan överst och en knapp längst ner. */
.splash {
  position: fixed; inset: 0; z-index: 100; background: #05070b; color: #efe6d0;
  display: flex; flex-direction: column; justify-content: flex-start; align-items: center; text-align: center;
  padding: max(28px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transition: opacity 0.9s ease; cursor: pointer; overflow: hidden;
}
.splash.borta { opacity: 0; pointer-events: none; }
.splash:focus-visible { outline: 2px solid #ffb45a; outline-offset: -6px; }
.splash picture, .splash img, .splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.splash img { object-fit: cover; object-position: 50% 45%; animation: splashin 2.4s ease-out both; }
@keyframes splashin { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
.splash::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgba(3,4,8,0.75) 0%, rgba(3,4,8,0) 32%, rgba(3,4,8,0) 62%, rgba(3,4,8,0.85) 100%); }
.splash > .logo { position: relative; z-index: 1; }
.logo { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; animation: logoin 2.2s 0.5s ease-out both; }
@keyframes logoin { from { opacity: 0; transform: translateY(-8px); letter-spacing: 0.3em; } to { opacity: 1; transform: none; } }
.logo .ort { font-family: var(--font-head); text-transform: uppercase; letter-spacing: 0.32em; font-size: clamp(0.7rem, 2.4vw, 0.9rem); color: #c9b48d; }
.logo .titel { font-family: var(--font-head); font-weight: 600; text-transform: uppercase; line-height: 0.9;
  font-size: clamp(3rem, min(15vw, 11vh), 7.5rem); letter-spacing: 0.06em; color: #f1e7cf; white-space: nowrap;
  text-shadow: 0 0 28px rgba(255, 168, 80, 0.35), 0 2px 0 rgba(0,0,0,0.6); }
.logo .under { display: flex; align-items: center; gap: 12px; font-family: var(--font-type); font-style: italic;
  font-size: clamp(1.1rem, min(4.6vw, 3.4vh), 2rem); color: #f1e7cf; }
.logo .under::before, .logo .under::after { content: ""; width: clamp(24px, 8vw, 64px); height: 1px; background: #c4382e; }
@media (prefers-reduced-motion: reduce) { .splash img, .logo { animation: none; } .splash { transition: none; } }
/* Bildrutan: pixelbilden skalas upp skarpt, utan utsmetning. */
.scen { margin: 0; background: #0b0d1a; border-bottom: 2px solid var(--ink); display: flex; justify-content: center; }
.scen canvas {
  display: block; width: 384px; height: 240px; max-width: 100%; object-fit: contain;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
.scen canvas.ritar { animation: rita 0.9s steps(24, end) both; }
@keyframes rita { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
@media (prefers-reduced-motion: reduce) { .scen canvas.ritar { animation: none; } }
footer.input { border-top: 2px solid var(--ink); background: var(--paper); padding-bottom: env(safe-area-inset-bottom, 0px); }
footer.input .wrap { padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
form { display: flex; gap: 8px; align-items: center; }
form label { font-weight: 700; color: var(--stamp); }
#cmd {
  flex: 1 1 auto; min-width: 0; font: inherit; color: var(--ink); background: transparent;
  border: none; border-bottom: 1px dashed var(--rule); padding: 6px 2px; outline: none;
}
#cmd:focus-visible { border-bottom-color: var(--stamp); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .06em; font-size: .8rem;
  color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 2px;
  padding: 4px 10px; cursor: pointer;
}
.quick button:hover { border-color: var(--ink); }
.quick button:focus-visible { outline: 2px solid var(--stamp); outline-offset: 1px; }

/* Klickläge: ägodelar som knappar, en namnskylt i bilden och en meny vid det man trycker på */
.scen { position: relative; }
.klicklage .scen canvas { touch-action: manipulation; }
.agodelar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.agodelar .rubrik { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; color: var(--muted); margin-right: 2px; }
.agodelar button {
  font-family: var(--font-type); font-size: .85rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--rule); border-radius: 2px; padding: 3px 9px; cursor: pointer;
}
.agodelar button:hover, .agodelar button:focus-visible { border-color: var(--stamp); outline: none; }
.namnskylt {
  position: absolute; transform: translate(-50%, -150%); pointer-events: none; white-space: nowrap;
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .8rem;
  color: #f1e7cf; background: rgba(10, 10, 16, .82); padding: 2px 8px; border-radius: 2px;
}
.klickmeny {
  position: fixed; z-index: 60; min-width: 150px; max-width: min(260px, calc(100vw - 16px));
  display: flex; flex-direction: column; background: var(--paper); border: 2px solid var(--ink);
  box-shadow: 0 6px 24px rgba(0, 0, 0, .35); padding: 4px;
}
.klickmeny .rubrik {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .8rem;
  color: var(--stamp); padding: 4px 8px 6px; border-bottom: 1px dashed var(--rule); margin-bottom: 2px;
}
.klickmeny button {
  font-family: var(--font-type); font-size: .95rem; text-align: left; color: var(--ink); background: transparent;
  border: none; padding: 8px 10px; cursor: pointer;
}
.klickmeny button:hover, .klickmeny button:focus-visible { background: var(--bg); outline: none; color: var(--stamp); }

/* Renodlat klickläge: inget inmatningsfält, bara ägodelar, utgångar och en menyknapp */
.klicklage form { display: none; }
#menyknapp {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .8rem;
  color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 2px; padding: 3px 10px; cursor: pointer;
}
#menyknapp:hover, #menyknapp:focus-visible { color: var(--stamp); border-color: var(--stamp); outline: none; }
.agodelar { flex-direction: column; align-items: stretch; }
.klickrad { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.klickrad .rubrik { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; color: var(--muted); margin-right: 2px; }
.klickrad button {
  font-family: var(--font-type); font-size: .85rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--rule); border-radius: 2px; padding: 3px 9px; cursor: pointer;
}
.klickrad button:hover, .klickrad button:focus-visible { border-color: var(--stamp); outline: none; }
.las-endast { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.las-endast button:focus { position: fixed; left: 8px; top: 8px; width: auto; height: auto; clip: auto; z-index: 70; }

/* Gul pil som visar att det finns mer text nedanför: en tonad kant längst ner i textytan och en liten pixelpil.
   Den går inte att klicka på, man scrollar som vanligt. */
#merpil {
  position: fixed; z-index: 5; height: 36px; padding: 0 16px 6px;
  display: flex; align-items: flex-end; justify-content: flex-end;
  background: linear-gradient(to bottom, transparent, var(--bg) 80%);
  color: var(--pil); pointer-events: none;
}
#merpil svg { width: 18px; height: 12px; filter: drop-shadow(0 1px 0 var(--pilskugga)); }
#merpil[hidden] { display: none; }

/* Bekräftelsedialog, t.ex. innan spelet börjar om */
dialog.bekrafta {
  width: min(340px, calc(100vw - 32px)); padding: 18px 20px 16px; color: var(--ink); background: var(--paper);
  border: 2px solid var(--ink); box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
}
dialog.bekrafta::backdrop { background: rgba(5, 7, 11, .6); }
dialog.bekrafta h2 {
  margin: 0 0 8px; font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em;
  font-size: 1.1rem; font-weight: 600; color: var(--stamp);
}
dialog.bekrafta p { margin: 0 0 16px; font-size: .95rem; }
dialog.bekrafta .knappar { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
dialog.bekrafta button {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-size: .85rem;
  padding: 8px 14px; border-radius: 2px; cursor: pointer; border: 1px solid var(--ink);
  background: transparent; color: var(--ink);
}
dialog.bekrafta button.ja { background: var(--stamp); border-color: var(--stamp); color: var(--paper); }
dialog.bekrafta button:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }

/* Samtal: svarsalternativ som knappar */
.samtalsval { display: flex; flex-direction: column; gap: 6px; padding-block: 2px 14px; max-width: 65ch; }
.samtalsval button {
  font-family: var(--font-type); font-size: .9rem; line-height: 1.3; text-align: left; color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule); border-left: 3px solid var(--stamp); border-radius: 2px;
  padding: 6px 10px; cursor: pointer;
}
.samtalsval button:hover, .samtalsval button:focus-visible { border-color: var(--stamp); outline: none; color: var(--stamp); }
.samtal-pagar.klicklage .agodelar { display: none; }
#log .val { color: var(--muted); margin-left: 1.5em; }
</style>

  // ------------------------------------------------------------------ samtal
  samtal: {
    prim: { start: "a", noder: {
      a: { text: "Du lyfter luren. En nervös kvinnoröst viskar: \"Är det detektiven? Mopsdetektiven? Papegojdetektiven?\"", val: [
        { text: "Det beror på vem som frågar.", till: "b" },
        { text: "Nej, det här är Grand Harbors tvätteri.", till: "skamt" },
        { text: "Fel nummer.", till: "fel" },
      ] },
      skamt: { text: "Det blir tyst. Sedan, mycket tyst: \"Hur... hur visste ni att det handlar om tvätt?\" Du visste inte det. Nu vet du.", val: [{ text: "Jag vet saker. Vem är det som ringer?", till: "b" }] },
      fel: { text: "\"Lägg inte på! Snälla! Det handlar om borgmästaren!\" Det låter så desperat att du inte har hjärta att lägga på.", val: [{ text: "Okej. Vem är det som ringer?", till: "b" }] },
      b: { text: "\"Penelope Prim, borgmästarens sekreterare. Något fruktansvärt har hänt. Något... personligt. Jag kan inte säga det i telefon, centralen lyssnar. Kom till rådhuset vid torget på Boulevarden så fort ni kan.\"", val: [
        { text: "Varför inte polisen?", till: "polis" },
        { text: "Hur kommer jag förbi receptionen?", till: "recep" },
      ] },
      polis: { text: "\"Kommissarie O'Hara skrattade så mycket att han fick hicka. Han har fortfarande hicka. Det var i förrgår.\"", val: [{ text: "Hur kommer jag förbi receptionen?", till: "recep" }] },
      recep: { text: "\"Fröken Blom släpper inte in privatdetektiver. Hon släpper knappt in borgmästaren. Säg att ni kommer från tvätteriet. Säg exakt så. Hon vet vad det betyder.\" Det klickar. Hon har lagt på.", gor: [{ satt: "uppdrag" }, { poang: "uppdrag" }, { sys: "(Rådhuset ligger vid torget, i västra änden av Boulevarden.)" }], val: [] },
    } },

    reception: { start: "a", noder: {
      a: { text: "Fröken Blom tittar upp över glasögonen utan att sluta skriva. \"Nummerlapp?\"", val: [
        { text: "Jag är privatdetektiv och ska träffa borgmästaren.", till: "nej1" },
        { text: "Jag kommer från tvätteriet.", till: "ja" },
        { text: "Jag vill klaga på regnet.", till: "nej2" },
        { text: "Jag är borgmästarens mamma.", till: "nej3" },
      ] },
      nej1: { text: "\"Borgmästaren tar inte emot privatdetektiver. Bara väljare, fotografer och hans mamma. Nästa!\"", val: [] },
      nej2: { text: "\"Regn hanteras av gatukontoret, rum 114. Nummerlappar sitter där borta. Nuvarande väntetid: tre veckor. Eller tills det slutar regna, vilket som kommer först.\"", val: [] },
      nej3: { text: "Fröken Blom tittar på dig i tre långa sekunder. \"Nej.\"", val: [] },
      ja: { text: "Fröken Blom slutar skriva. Kön tystnar förvånat. Det är första gången på flera år, enligt kön. \"Tvätteriet\", säger hon lågt. \"Andra våningen. Gå direkt in. Och torka av skorna.\"", gor: [{ satt: "radhus" }, { poang: "radhus" }], val: [] },
      igen: { text: "\"Ni igen. Upp med er. Och torka av skorna, sa jag.\"", val: [] },
    } },

    borgmastare: { start: "a", noder: {
      a: { text: "Borgmästaren slutar gå fram och tillbaka. \"Är det detektiven? Stäng dörren! Fröken Prim, lås den! Det som sägs i det här rummet stannar i det här rummet. Lova det!\"", val: [
        { text: "Jag lovar.", till: "b" },
        { text: "Det beror på hur mycket ni betalar.", till: "pris" },
        { text: "Jag har lovat saker förut. Det brukar gå bra.", till: "b" },
      ] },
      pris: { text: "\"Hundra dollar och evig tacksamhet\", säger borgmästaren. \"Och ett gatunamn om ni vill. En liten gata. En gränd.\" Fröken Prim skriver ner det och stryker under det två gånger.", val: [{ text: "Då lovar jag.", till: "b" }] },
      b: { text: "Borgmästaren sjunker ner i stolen. \"Mina turkalsonger. Röda långkalsonger i ylle med mitt monogram. Jag har haft dem på mig vid varje val sedan 1931 och har aldrig förlorat. De stals från Steam Laundry i förrgår natt. Och i morse kom det här.\" Fröken Prim räcker dig ett brev.", gor: [{ flytta: "utpressningsbrev", till: "spelare" }, { satt: "klient" }, { poang: "klient" }, { sys: "(Du har fått utpressningsbrevet.)" }], till: null, val: [
        { text: "Vad står det i brevet?", till: "brev", engang: true },
        { text: "Vem visste om kalsongerna?", till: "vem", engang: true },
        { text: "Vem tjänar på att ni drar er ur valet?", till: "motiv", engang: true },
        { text: "Var ligger tvätteriet?", till: "tvatt", engang: true },
        { text: "Jag ska hitta dem.", till: "slut" },
      ] },
      brev: { text: "\"Läs själv\", säger borgmästaren och viftar med handen. \"Om jag inte drar mig ur valet före debatten i morgon kväll hissas kalsongerna på rådhusets flaggstång medan hela stan lyssnar på radion. Hela stan! Och de har ett hål!\"", val: [{ text: "Fortsätt.", till: "b2" }] },
      vem: { text: "\"Bara fröken Prim, min chaufför, tvätteriet och min mamma. Och nu ni. Och utpressaren. Och, gissar jag, utpressarens hantlangare. Det börjar bli många.\"", val: [{ text: "Fortsätt.", till: "b2" }] },
      motiv: { text: "\"Hank Hollister, så klart. Min motkandidat. Han bor på Hotel Majestic och har en kampanjchef som är farligare än han själv. Hank är dum som ett spån. Ett trevligt spån, men ändå.\"", val: [{ text: "Fortsätt.", till: "b2" }] },
      tvatt: { text: "\"Steam Laundry\", säger fröken Prim. \"I gränden bakom urmakaren på Boulevarden. Bakdörren. Fru Grubb pratar bara med kunder, så hon har inte sagt ett ord till polisen.\"", val: [{ text: "Fortsätt.", till: "b2" }] },
      b2: { text: "Borgmästaren väntar, och torkar pannan.", val: [
        { text: "Vad står det i brevet?", till: "brev", engang: true },
        { text: "Vem visste om kalsongerna?", till: "vem", engang: true },
        { text: "Vem tjänar på att ni drar er ur valet?", till: "motiv", engang: true },
        { text: "Var ligger tvätteriet?", till: "tvatt", engang: true },
        { text: "Jag ska hitta dem.", till: "slut" },
      ] },
      slut: { text: "\"Gör det\", säger borgmästaren. \"Före debatten. Och, detektiven... diskret.\" Fröken Prim följer dig till dörren och viskar: \"Han sover inte. Han har inte sovit sedan i förrgår. Han sover alltid i dem.\"", val: [] },
      igen: { text: "\"Har ni hittat dem?\" Borgmästaren tittar hoppfullt på dina händer.", val: [
        { text: "Vem visste om kalsongerna?", till: "vem" },
        { text: "Vem tjänar på att ni drar er ur valet?", till: "motiv" },
        { text: "Var ligger tvätteriet?", till: "tvatt" },
        { text: "Inte än.", till: "inteAn" },
      ] },
      inteAn: { text: "Borgmästaren suckar så djupt att mustaschen fladdrar. \"Klockan tickar, detektiven. Och flaggstången väntar.\"", val: [] },
    } },

    grubb: { start: "a", noder: {
      a: { text: "Fru Grubb torkar händerna på förklädet och tittar på dig som på en fläck hon inte får bort. \"Lapp?\"", val: [
        { text: "Här är min tvättlapp.", om: { bar: "tvattlapp" }, till: "lapp" },
        { text: "Jag vill fråga om borgmästarens kalsonger.", om: { inteFlagga: "rockHamtad" }, till: "kund" },
        { text: "Jag tittar bara.", till: "titta" },
      ] },
      titta: { text: "\"Titta med ögonen, inte med fingrarna. Och inte för länge. Ångan är inte gratis.\"", val: [] },
      kund: { text: "\"Jag pratar bara med kunder. Polisen var här. De var inte kunder. Ni är inte kund. Inte utan lapp. Ut.\"", val: [] },
      lapp: { text: "Hon läser lappen och försvinner in i ångan. Hon kommer tillbaka med din trenchcoat, vikt som en flagga. \"Nummer 1347. En trenchcoat. Tvättad, struken och lagad i vänster ficka, där det var ett hål stort som en mops. Det är betalt. Någon på rådhuset betalade i förskott. Ni har vänner.\"", gor: [{ flytta: "tvattlapp" }, { flytta: "rock", till: "spelare" }, { satt: "rockHamtad" }, { poang: "rock" }, { sys: "(Du har fått tillbaka din trenchcoat.)" }], val: [
        { text: "Får jag fråga om borgmästarens kalsonger?", till: "natt" },
        { text: "Tack, fru Grubb.", till: "slut" },
      ] },
      natt: { text: "Hon sänker rösten och lutar sig fram genom ångan. \"Ni är kund, så ni får veta. I förrgår natt, klockan tolv. En karl kom in genom bakdörren och sa att han skulle hämta åt borgmästaren. Jag vände ryggen till en sekund. När jag vände mig om var han borta, och kalsongerna med honom.\"", gor: [{ satt: "grubbNatt" }], val: [
        { text: "Hur såg han ut?", till: "utseende", engang: true },
        { text: "Sa han något mer?", till: "sa", engang: true },
        { text: "Märkte du något annat?", till: "annat", engang: true },
        { text: "Tack, fru Grubb.", till: "slut" },
      ] },
      utseende: { text: "\"Ångan, vet ni. Men han hade uniform. Röd, med mässingsknappar. Och en liten mössa, det stod något på den. Jag såg inte vad. Han hade ett leende med för många tänder.\"", gor: [{ satt: "uniform" }], val: [{ text: "Något mer?", till: "natt2" }] },
      sa: { text: "\"Han visslade. Hela tiden. Den där melodin man hör på karuseller, om och om igen. Jag ville kasta mangeln på honom.\"", gor: [{ satt: "vissling" }], val: [{ text: "Något mer?", till: "natt2" }] },
      annat: { text: "Hon rynkar näsan. \"Han luktade. Popcorn. Och fisk. Som om han hade ätit popcorn på fiskmarknaden. Eller fisk på en biograf. Jag vet inte vilket som är värst.\"", gor: [{ satt: "lukt" }], val: [{ text: "Något mer?", till: "natt2" }] },
      natt2: { text: "Fru Grubb väntar, med armarna i kors.", val: [
        { text: "Hur såg han ut?", till: "utseende", engang: true },
        { text: "Sa han något mer?", till: "sa", engang: true },
        { text: "Märkte du något annat?", till: "annat", engang: true },
        { text: "Tack, fru Grubb.", till: "slut" },
      ] },
      slut: { text: "\"Hitta honom\", säger fru Grubb. \"Ingen stjäl från mitt tvätteri. Ingen. Och kom tillbaka med kalsongerna, för de är inte strukna.\"", gor: [{ om: { flagga: ["uniform", "vissling", "lukt"] }, poang: "grubb" }, { om: { flagga: ["uniform", "vissling", "lukt"] }, satt: "grubb" }], val: [] },
      igen: { text: "\"Ni igen. Vad vill ni?\"", val: [
        { text: "Här är min tvättlapp.", om: { bar: "tvattlapp" }, till: "lapp" },
        { text: "Berätta om natten igen.", om: { flagga: "rockHamtad" }, till: "natt" },
        { text: "Ingenting. Hej då.", till: "titta" },
      ] },
    } },

    piccolo: { start: "a", noder: {
      a: { text: "\"God kväll, sir!\" Piccolon gör honnör med fel hand. \"Rum? Bagage? Hemligheter? Jag har allt utom rum, vi är fullbokade för valet.\"", val: [
        { text: "Vem bor på hotellet just nu?", till: "vem", engang: true },
        { text: "Kan du hjälpa mig att ta en titt i gästboken?", till: "bok" },
        { text: "Här är en autograf av Rex Rapp.", om: { bar: "autograf" }, till: "autograf" },
        { text: "Ingenting, tack.", till: "slut" },
      ] },
      vem: { text: "\"Det får jag inte säga, sir. Men om jag fick säga det skulle jag säga att Hank Hollister har hela fjärde våningen, och att hans kampanjchef sitter i baren varje kväll klockan sex. Damen i lila. Men det har jag inte sagt.\"", val: [{ text: "Något annat?", till: "a" }] },
      bok: { text: "Piccolon tittar mot conciergen och sänker rösten. \"Mr. Fennimore lämnar aldrig disken. Utom när hans mamma ringer. Jag skulle kunna säga att hon ringer, sir. Men det kostar. Inte pengar. Jag samlar autografer. Har ni en från Rex Rapp? Han är min hjälte. Han har världens blankaste hår.\"", gor: [{ satt: "piccoloVill" }], val: [{ text: "Jag ska se vad jag kan göra.", till: "slut" }] },
      autograf: { text: "Piccolon stirrar på autografen. \"REX RAPP! 'Till min största lyssnare!' Det är ju jag! Han vet vem jag är!\" Han stoppar fotot innanför uniformen, rätar på mössan och ropar med en röst som ekar i hela lobbyn: \"MR. FENNIMORE! TELEFON! DET ÄR ER MAMMA!\" Conciergen bleknar, mumlar något och försvinner in i bakrummet.", gor: [{ flytta: "autograf" }, { satt: "conciergeBorta" }, { poang: "piccolo" }], val: [] },
      slut: { text: "Piccolon gör honnör igen, med rätt hand den här gången, av ren tur.", val: [] },
    } },

    rex: { start: "a", noder: {
      a: { text: "Rex Rapp vänder sig från mikrofonen med hela sitt leende. \"En besökare! En lyssnare! Ni lyssnar väl på mitt program?\"", val: [
        { text: "Varje kväll. Rex Rapps kvällsshow är det bästa som finns på radion.", till: "smicker" },
        { text: "Jag lyssnar bara på polisradion.", till: "polis" },
        { text: "Vad är det för debatt i morgon?", till: "debatt", engang: true },
        { text: "Jag har inte radio.", till: "ingen" },
      ] },
      smicker: { text: "Rex Rapps leende blir ännu bredare, vilket du inte trodde var möjligt utan kirurgi. \"En man med smak! En man med öron! Vill ni ha en autograf?\"", val: [
        { text: "Gärna. Till en vän.", till: "autograf" },
        { text: "Nej tack.", till: "nejtack" },
      ] },
      autograf: { text: "Rex Rapp tar fram ett fotografi av sig själv ur en hög med fotografier av sig själv och skriver \"Till min största lyssnare! /Rex\" med en penna som är nästan lika blank som hans hår. Han frågar inte vem det är till. Han antar att alla är hans största lyssnare.", gor: [{ flytta: "autograf", till: "spelare" }, { satt: "autografFatt" }, { poang: "rex" }], val: [] },
      nejtack: { text: "Rex Rapp ser ut som om du hade sparkat hans hund. \"Nej tack? Ingen har sagt nej tack till mig sedan 1938. Det var min mamma.\"", val: [{ text: "Förlåt. Jag tar gärna en autograf, till en vän.", till: "autograf" }] },
      polis: { text: "\"Polisradion! De har ingen humor, ingen musik och ingen reklam för tvål! Ut, ut!\" Han vänder sig demonstrativt mot mikrofonen.", val: [] },
      ingen: { text: "Rex Rapp blir alldeles tyst, vilket teknikern bakom glaset firar med en liten dans. \"Ingen radio? I Grand Harbor? Det är som att inte ha ett hjärta. Eller öron.\"", val: [{ text: "Fast jag lyssnar alltid på er hos grannen.", till: "smicker" }] },
      debatt: { text: "\"Debatten! I morgon kväll klockan åtta, Bigsby mot Hollister, live från rådhusets balkong! Bigsby har vunnit varje val i sexton år. Han har en hemlighet, säger folk. Någon sorts tur.\" Han blinkar. \"Lyssnarsiffrorna blir enorma. Särskilt om något går fel.\"", val: [{ text: "Något annat?", till: "a" }] },
      igen: { text: "\"Min favoritlyssnare!\" ropar Rex Rapp, som säger det till alla.", val: [] },
    } },

    vane: { start: "a", noder: {
      a: { text: "Kvinnan i lila blåser ut ett moln av lila rök. \"En detektiv. Hur charmigt. Vivian Vane. Sätt er, men inte för nära, jag har ny klänning.\"", val: [
        { text: "Ni är Hank Hollisters kampanjchef.", till: "chef", engang: true },
        { text: "Var var ni i förrgår natt?", till: "alibi", engang: true },
        { text: "Vilken vacker färg på ert bläck, miss Vane. Det syns i gästboken.", om: { flagga: "gastbok" }, till: "black", engang: true },
        { text: "Utpressningsbrevet till borgmästaren är skrivet på Majestics brevpapper.", om: { flagga: "vattenmarke" }, till: "papper", engang: true },
        { text: "Lila bläck och Majestics vattenstämpel, miss Vane. Och ni bor i rum 507. Brevet är ert.", om: { flagga: ["vattenmarke", "gastbok"], inteFlagga: "vane" }, till: "erkann" },
        { text: "Jag ska gå nu.", till: "hejda" },
      ] },
      chef: { text: "\"Det är ingen hemlighet. Hank är en enkel man. Någon måste tänka åt honom, och någon måste se till att han vinner.\" Hon ler. Det är inte ett varmt leende. Det är ett leende för fotografer.", val: [{ text: "Något annat.", till: "a" }] },
      alibi: { text: "\"Här. Vid det här bordet. Med en martini. Fråga Ramón.\" Bartendern nickar utan att sluta skaka. Han skulle nicka åt vad som helst hon sa.", val: [{ text: "Något annat.", till: "a" }] },
      black: { text: "Hennes ögon smalnar bakom slöjan. \"Lila är min färg. Så vad? Läser ni andras gästböcker, detektiven? Det är inte särskilt artigt.\" Hon dricker. Lite för fort.", val: [{ text: "Något annat.", till: "a" }] },
      papper: { text: "\"Halva stan stjäl Majestics brevpapper. Det är det enda som är gratis här. Ni har säkert ett ark i fickan själv.\" Hon slår av askan i askkoppen med en liten darrning.", val: [{ text: "Något annat.", till: "a" }] },
      erkann: { text: "Vivian Vane sitter alldeles stilla en lång stund. Sedan fimpar hon cigaretten och säger, mycket lugnt: \"Okej. Jag skrev brevet. Hank vet ingenting, han tror att en flaggstång är något man äter till frukost. Men jag har inte kalsongerna. Jag betalade en karl tjugo dollar för att hämta dem på tvätteriet och gömma dem till debatten. En utropare från Nöjespiren. Han kallar sig Lucky. Var han har gömt dem vet jag inte. Jag ville inte veta.\"", gor: [{ satt: "vane" }, { poang: "vane" }], val: [
        { text: "Ni får förklara det för kommissarien.", till: "kommissarie" },
        { text: "Varför kalsonger?", till: "varfor" },
      ] },
      varfor: { text: "\"Därför att Bigsby är vidskeplig. Utan dem tror han att han förlorar. Och en man som tror att han förlorar, förlorar.\" Hon tänder en ny cigarett. \"Det är politik, detektiven. Det är som tvätt. Någon måste göra det smutsiga.\"", val: [{ text: "Ni får förklara det för kommissarien.", till: "kommissarie" }] },
      kommissarie: { text: "\"O'Hara? Han har hicka. Lycka till med att få honom att lyssna.\" Hon lyfter sitt glas mot dig. \"Skål för er, detektiven. Ni är bättre än jag trodde. Det var inte svårt.\"", val: [] },
      hejda: { text: "\"Så snart? Vi som hade det så trevligt.\" Hon vinkar med munstycket.", val: [] },
    } },

    lou: { start: "a", noder: {
      a: { text: "\"Steeeg fram, steeeg fram!\" Utroparen svänger med megafonen. \"Lucky Lou heter jag, och det här är Nöjespiren, stadens roligaste plats efter rådhuset! Inträde tio cent, eller GRATIS för den som klarar Lucky Lous stora Grand Harbor-frågesport!\"", val: [
        { text: "Jag tar frågesporten.", om: { inteFlagga: "quiz" }, till: "q1" },
        { text: "Jag har inga tio cent.", om: { inteFlagga: "quiz" }, till: "pengar" },
        { text: "Vilken melodi är det du visslar?", om: { flagga: "vissling" }, till: "melodi", engang: true },
        { text: "Jag vet att du stal borgmästarens långkalsonger.", om: { flagga: "vane", inteFlagga: "lou" }, till: "anklaga" },
        { text: "Hej då.", till: "hejda" },
      ] },
      pengar: { text: "\"Då tar du frågesporten, kompis! Alla vinner! Nästan ingen!\"", val: [{ text: "Okej, kör.", till: "q1" }] },
      melodi: { text: "Lou slutar vissla tvärt. \"Visslar? Jag? Det är karusellen, kompis. Den sitter i huvudet på alla här. Man visslar den i sömnen. Man visslar den på...\" Han tystnar. \"...på jobbet.\"", val: [{ text: "Något annat.", till: "a" }] },
      q1: { text: "\"Fråga ett!\" Lou blåser i en liten visselpipa. \"Vad heter stadens grundare, han som pekar i fontänen på torget?\"", val: [
        { text: "Horace Pettigrew.", till: "fel" },
        { text: "Ezekiel Harbor.", till: "q2" },
        { text: "Otto Tick.", till: "fel" },
        { text: "Bartholomew Bigsby.", till: "fel" },
      ] },
      q2: { text: "\"RÄTT! Fråga två! Vilket år började rådhusklockan gå, den som aldrig går fel?\"", val: [
        { text: "1902.", till: "fel" },
        { text: "1947.", till: "fel" },
        { text: "1889.", till: "q3" },
        { text: "1824.", till: "fel" },
      ] },
      q3: { text: "\"RÄTT IGEN! Sista frågan, och den är svår! Han som hittade fru Pettigrews mops, mopsdetektiven, han var i tidningen! På vilken våning har han sitt kontor?\"", val: [
        { text: "Tredje.", till: "fel" },
        { text: "Trettonde.", till: "fel" },
        { text: "Femte.", till: "ratt" },
        { text: "Han har inget kontor, han bor i sin rock.", till: "fel" },
      ] },
      fel: { text: "\"BZZZT!\" Lou trycker på en tuta. \"Fel, kompis! Lär känna din stad och kom tillbaka! Lucky Lou väntar!\"", val: [] },
      ratt: { text: "\"ALLA RÄTT!\" Lou blåser i visselpipan, tutar i tutan och slår på en liten trumma som du inte såg att han hade. \"Gå in, gå in, gå in! Och säg att Lucky Lou skickade dig!\" Han låser upp vändkorset med en nyckel på en kedja.", gor: [{ satt: "quiz" }, { poang: "quiz" }], val: [] },
      anklaga: { text: "Lou slutar le. Det tar en stund, det är mycket leende att stänga av. \"Kalsonger? Jag? Jag har aldrig sett ett par kalsonger i hela mitt liv. Jag har inte ens på mig några.\"", val: [
        { text: "Fru Grubb på tvätteriet kände igen din vissling och din uniform.", om: { flagga: ["vissling", "uniform"] }, till: "grubb", engang: true },
        { text: "Miss Vane har berättat allt. Tjugo dollar, sa hon.", till: "vane", engang: true },
        { text: "Din skuldsedel låg på Diamant-Dinos roulettbord. 'Betalas när V.V. har betalat mig för jobbet.'", om: { bar: "skuldsedel" }, till: "sedel", engang: true },
        { text: "Erkänn, Lou. Det är över.", om: { bar: "skuldsedel" }, till: "erkann" },
        { text: "Vi pratar om det senare.", till: "hejda" },
      ] },
      grubb: { text: "\"Tvätterskan? Hon kunde inte se någonting i all den där ångan! Och många visslar! Och många har uniform!\" Han svettas nu. Svetten luktar popcorn.", val: [{ text: "Fortsätt.", till: "anklaga2" }] },
      vane: { text: "\"Den lila damen? Hon lovade att hålla tyst! Hon lovade!\" Han slår handen för munnen. För sent.", val: [{ text: "Fortsätt.", till: "anklaga2" }] },
      sedel: { text: "Lou stirrar på skuldsedeln. \"Det... det är min karusellhäst. Ingen annan ritar en karusellhäst. Jag har ritat den sedan jag var sex.\"", val: [{ text: "Fortsätt.", till: "anklaga2" }] },
      anklaga2: { text: "Lucky Lou ser inte särskilt lucky ut längre.", val: [
        { text: "Fru Grubb på tvätteriet kände igen din vissling och din uniform.", om: { flagga: ["vissling", "uniform"] }, till: "grubb", engang: true },
        { text: "Miss Vane har berättat allt. Tjugo dollar, sa hon.", till: "vane", engang: true },
        { text: "Din skuldsedel låg på Diamant-Dinos roulettbord. 'Betalas när V.V. har betalat mig för jobbet.'", om: { bar: "skuldsedel" }, till: "sedel", engang: true },
        { text: "Erkänn, Lou. Det är över.", om: { bar: "skuldsedel" }, till: "erkann" },
        { text: "Vi pratar om det senare.", till: "hejda" },
      ] },
      erkann: { text: "Lou sjunker ihop som ett punkterat ballongdjur. \"Okej, okej! Jag tog dem! Jag var skyldig Dino pengar och damen betalade bra! Jag gömde dem i spöktåget hos Sigge, skelettet. Ingen går in där sedan strömmen gick. Snälla, säg inget till min mamma. Hon tror att jag är tandläkare.\"", gor: [{ satt: "lou" }, { poang: "lou" }], val: [] },
      hejda: { text: "\"Kom tillbaka snart, kompis! Lucky Lou väntar!\" Han börjar vissla igen. Karusellmelodin.", val: [] },
    } },

    dorrlucka: { start: "a", noder: {
      a: { text: "Det dånar dovt när du slår på gonggongen. Luckan i den röda dörren glider upp. Två ögon tittar ut. En röst säger: \"Lösenord?\"", val: [
        { text: "Sesam, öppna dig.", till: "fel1" },
        { text: "Jag är en vän till Benny.", till: "benny" },
        { text: "Den gyllene draken sover aldrig.", till: "ratt" },
        { text: "Polis! Öppna!", till: "polis" },
      ] },
      fel1: { text: "\"Fel saga.\" Luckan smäller igen.", val: [] },
      benny: { text: "\"Alla är vänner till Benny. Benny har för många vänner. Lösenord?\"", val: [
        { text: "Sesam, öppna dig.", till: "fel1" },
        { text: "Den gyllene draken sover aldrig.", till: "ratt" },
        { text: "Jag kommer tillbaka.", till: "slut" },
      ] },
      polis: { text: "Luckan smäller igen. Inifrån hörs ljudet av tjugo personer som går ut genom en bakdörr samtidigt, och en roulettkula som stannar.", val: [] },
      ratt: { text: "Ögonen tittar på dig en lång stund. Sedan smäller luckan igen, och det klickar i låset. Dörren glider upp på glänt.", gor: [{ satt: "losen" }, { poang: "losen" }], val: [] },
      slut: { text: "Luckan smäller igen.", val: [] },
    } },

    ohara: { start: "a", noder: {
      a: { text: "Kommissarie O'Hara lyfter blicken från en akt. \"Detektiven. *Hick.* Mopsmannen. Vad vill ni? Om det gäller borgmästarens... *hick*... underkläder, så har jag redan skrattat färdigt. Nästan.\"", val: [
        { text: "Vivian Vane, Hollisters kampanjchef, skrev utpressningsbrevet.", om: { flagga: "vane" }, till: "vane", engang: true },
        { text: "Lucky Lou på Nöjespiren stal kalsongerna åt henne.", om: { flagga: "lou" }, till: "lou", engang: true },
        { text: "Jag har både brevskrivaren och tjuven åt er, med erkännanden.", om: { flagga: ["vane", "lou"], inteFlagga: "polis" }, till: "gripa" },
        { text: "Varför tog ni inte fallet själv?", till: "varfor", engang: true },
        { text: "Hej då, kommissarien.", till: "hejda" },
      ] },
      varfor: { text: "\"Därför att ingen *hick* i hela kåren kunde säga ordet långkalsonger utan att börja skratta. Vi försökte. Sergeant Muldoon fick åka till akuten.\"", val: [{ text: "Något annat.", till: "a" }] },
      vane: { text: "O'Hara sätter sig upp. Hickan stannar ett ögonblick, av ren förvåning. \"Vane? Hon är farlig. Har ni bevis?\"", val: [{ text: "Något annat.", till: "a" }] },
      lou: { text: "\"Lucky Lou! *Hick.* Vi har haft ett öga på honom sedan han sålde popcorn som han påstod botade flintskallighet.\"", val: [{ text: "Något annat.", till: "a" }] },
      gripa: { text: "O'Hara reser sig, sätter på sig hatten och ropar ut i hallen: \"MULDOON! Två bilar! En till Hotel Majestic och en till Nöjespiren!\" Han tittar på dig. Hickan är borta. \"Bra jobbat, detektiven. Riktigt bra. Säg inget om det här till någon. Jag har ett rykte.\"", gor: [{ satt: "polis" }, { poang: "polis" }], val: [] },
      hejda: { text: "\"*Hick.*\" Det låter som ett adjö.", val: [] },
    } },

    batkarl: { start: "a", noder: {
      a: { text: "Båtkarlen tar pipan ur munnen. \"Svanbåt? 25 cent. Eller vill ni höra om stadens historia? Det är gratis. Ingen vill höra den.\"", val: [
        { text: "Berätta om stadens historia.", till: "historia" },
        { text: "Vem står i fontänen på torget?", till: "fontan", engang: true },
        { text: "Hur gammal är rådhusklockan?", till: "klocka", engang: true },
        { text: "Nej tack.", till: "slut" },
      ] },
      historia: { text: "\"1824 rodde Ezekiel Harbor in i hamnen i en eka med en get, en Bibel och en tunna rom. Han grundade staden, döpte den efter sig själv och drack upp rommen. Geten blev den första borgmästaren, enligt somliga.\"", val: [{ text: "Något mer?", till: "a" }] },
      fontan: { text: "\"Ezekiel Harbor själv, i brons. Han pekar mot krogen som han öppnade 1825. Den stängde 1851. Han pekar fortfarande. Envis karl.\"", val: [{ text: "Något mer?", till: "a" }] },
      klocka: { text: "\"Rådhusklockan? Jag var där när den startade, 1889. Jag var sju år. Borgmästaren drog i ett snöre och klockan slog tolv, och sedan har den aldrig gått fel. Det är mer än man kan säga om borgmästarna.\"", val: [{ text: "Något mer?", till: "a" }] },
      slut: { text: "\"Som ni vill.\" Han stoppar tillbaka den slocknade pipan.", val: [] },
    } },

    fyrvaktare: { start: "a", noder: {
      a: { text: "Fyrvaktaren nickar. \"Sällan man får besök här ute. Senast var det en säl. Den sa inte mycket heller.\"", val: [
        { text: "Har du sett något konstigt på sistone?", till: "konstigt", engang: true },
        { text: "Hur länge har du varit fyrvaktare?", till: "lange", engang: true },
        { text: "Hej då.", till: "slut" },
      ] },
      konstigt: { text: "\"I förrgår natt, sent. En karl i röd uniform kom gående från stan med ett rött knyte under armen. Han visslade karusellmusik och gick in på Nöjespiren. Klockan var efter tolv, och då är det stängt där. Jag tänkte inte mer på det. Folk är konstiga.\"", gor: [{ satt: "fyrvittne" }], val: [{ text: "Något annat.", till: "a" }] },
      lange: { text: "\"Sedan 1889. Samma år som rådhusklockan startade. Vi är jämngamla, klockan och jag. Ingen av oss har gått fel.\"", val: [{ text: "Något annat.", till: "a" }] },
      slut: { text: "\"Akta er för dimman. Den äter detektiver.\"", val: [] },
    } },

    fiskhandlare: { start: "a", noder: {
      a: { text: "\"Färsk fisk! Färskare än borgmästarens löften!\" Sill-Sven viftar med torsken mot dig. \"Vad vill ni?\"", val: [
        { text: "Har du sett en man i röd uniform med mässingsknappar?", om: { flagga: "uniform" }, till: "uniform", engang: true },
        { text: "Vad tycker du om valet?", till: "val", engang: true },
        { text: "Ingenting, tack.", till: "slut" },
      ] },
      uniform: { text: "\"Lucky Lou från Nöjespiren, menar ni? Han köper en sill varje kväll, äter den med popcorn och visslar den där förbaskade karusellmelodin. I förrgår natt kom han förbi efter midnatt med ett rött knyte, gömde det under rocken när han såg mig, och skyndade till Nöjespiren. Jag sa till torsken: den där har något på gång.\"", gor: [{ satt: "fiskvittne" }, { poang: "fisk" }], val: [{ text: "Tack.", till: "slut" }] },
      val: { text: "\"Jag röstar på den som lovar att förbjuda måsar. Ingen har lovat det än. Därför röstar jag inte.\"", val: [{ text: "Något annat.", till: "a" }] },
      slut: { text: "Sill-Sven viftar adjö med torsken.", val: [] },
    } },

    vaktmastare: { start: "a", noder: {
      a: { text: "Vaktmästaren river en biljett som ingen har gett honom. \"Biljett? Föreställningen har börjat. Monstret har redan kommit upp ur vattnet. Det gör det varje kväll klockan nio.\"", val: [
        { text: "Var var du i förrgår natt vid tolv?", om: { flagga: "uniform" }, till: "alibi", engang: true },
        { text: "Snygg uniform.", till: "uniform", engang: true },
        { text: "Ingenting. Hej då.", till: "slut" },
      ] },
      alibi: { text: "\"Här, i maskinrummet. Jag visade Jätteapan tre gånger i rad för en enda man som somnade. Fråga honom, han sover där inne fortfarande.\" Han luktar popcorn. Bara popcorn. Ingen fisk.", val: [{ text: "Något annat.", till: "a" }] },
      uniform: { text: "\"Tack! Alla uniformer i stan kommer från samma skräddare, Uniform-Ulf på Main Street. Portiern på Majestic har samma. Och utroparen på Nöjespiren. Vi kallar oss mässingsknappsbrödraskapet.\"", val: [{ text: "Något annat.", till: "a" }] },
      slut: { text: "Han river en biljett till, bara för att hålla händerna sysselsatta.", val: [] },
    } },
  },

  // ------------------------------------------------------------------ handlingar
  handlingar: {
    vattenmarke: [
      { om: { flagga: "vattenmarke" }, text: "Du håller upp brevet mot ljuset igen. Vattenstämpeln syns fortfarande: HOTEL MAJESTIC." },
      { om: { inteFlagga: "vattenmarke" }, text: "Du håller upp utpressningsbrevet mot ljuset. Papperet lyser upp, och i det framträder en vattenstämpel: en liten krona och orden HOTEL MAJESTIC. Utpressaren skriver på dyrt papper. Utpressaren bor kanske där papperet finns." },
      { om: { inteFlagga: "vattenmarke" }, poang: "vattenmarke" },
      { satt: "vattenmarke" },
    ],
    vinst: [
      { satt: "vunnit" },
      { ljud: "fanfar", fordrojning: 1.2, ljudFordrojning: -1 },
      { flytta: "kalsonger", till: "borgmastaren" },
      "Du lägger de röda långkalsongerna på borgmästarens skrivbord. Borgmästaren stirrar på dem. Sedan på dig. Sedan på dem igen. Hans mustasch darrar. \"Mina... mina turkalsonger!\" Han kramar dem som en förlorad son. Fröken Prim gråter lite och skriver ner det.",
      { om: { flagga: "polis" }, text: "Samma kväll grips Vivian Vane i Majestic-baren mitt i en lila cocktail, och Lucky Lou vid karusellen mitt i en vissling. Kommissarie O'Hara håller en presskonferens. Han nämner inte kalsonger en enda gång. Hans hicka kommer tillbaka direkt efteråt." },
      { om: { inteFlagga: "polis" }, text: "Vivian Vane lämnar stan samma natt med tre kappsäckar, alla lila. Lucky Lou fortsätter att ropa ut sin frågesport, men han visslar inte längre. Han ser sig om över axeln var tionde sekund." },
      "Kvällen därpå sänds debatten live från rådhusets balkong. Borgmästare Bigsby står bredvid Hank Hollister i sin bästa kostym. Det är bara du och fröken Prim som vet vad han har under. Han talar som aldrig förr. Hollister glömmer vad han heter i andra frågan.",
      "På flaggstången över dem vajar stadsflaggan och ingenting annat. Rex Rapp kallar det årets största radioögonblick. Ingen förstår varför borgmästaren blinkar mot flaggstången hela tiden.",
      "Bigsby vinner valet med största marginalen i stadens historia. Du får hundra dollar, evig tacksamhet och en liten gränd uppkallad efter dig: Detektivgränd. Den går mellan Hendersonhuset och en soptunna. Det är perfekt.",
      { poang: "vunnit" },
      { stampel: "Fallet avslutat" },
      { slutsummering: true },
      { sys: "Välj Börja om i menyn för att spela igen." },
      { spelSlut: true },
    ],
  },

  // ------------------------------------------------------------------ regler
  regler: [
    // ---- Från förra fallet: svar för sakerna som finns kvar
    // Stämningssaker i kontoret
    { verb: "ta", objekt: "lampa", gor: ["Lampan är det enda i kontoret som är avbetalt. Den får stå kvar."] },
    { verb: "ta", objekt: "flaska", gor: ["Du lyfter flaskan mot ljuset och hoppas på ett mirakel. Det kommer inget. Du ställer tillbaka den."] },
    { verb: "ta", objekt: "rakningar", gor: ["Du lyfter upp räkningarna. De känns tyngre än papper borde göra. Du lägger tillbaka dem, med den argaste underst."] },
    { verb: "ta", objekt: "hatt", gor: ["Du låter hatten hänga kvar på hängaren. Den har haft en lång vecka, den också."] },
    { verb: "ta", objekt: "askkopp", gor: ["Du tänker tömma askkoppen. Sedan tänker du om. Den är nästan det enda här som fungerar som det ska."] },
    { verb: "ta", objekt: "stol", gor: ["Du sätter dig en stund i stolen och funderar. Den gnisslar instämmande. Sedan reser du dig. Fallet löser sig inte självt."] },
    { verb: "ta", objekt: "kalender", gor: ["Kalendern får hänga kvar. Om du tar ner den blir det inte fredag senare för det."] },
    { verb: "ta", objekt: "diplom", gor: ["Diplomet får hänga kvar. Det är det enda beviset på att du har gått en kurs i något."] },
    { verb: "ät", objekt: "askkopp", gor: ["Nej. Inte ens på en tisdag."] },

    // Stämningssaker på gator, i lokaler och på perronger
    { verb: "ta", objekt: "bil", gor: ["Du är privatdetektiv, inte biltjuv. Dessutom har du inget körkort sedan händelsen med fruktvagnen."] },
    { verb: ["gå", "öppna"], objekt: "diner", gor: ["Du har redan skuld hos Rosie. Hon har skrivit upp ditt namn på en tavla bakom disken. Det står i rött."] },
    { verb: "gå", objekt: "kontorsfonster", gor: [{ utfor: "in" }] },
    { verb: "ta", objekt: "trad", gor: ["Du böjer dig mot krukan. Portiern harklar sig. Du rätar på dig och låtsas att du knöt skorna."] },
    { verb: "prata", objekt: "duva", gor: ["Duvan kuttrar något som låter som \"avgå\". Hon tittar på din rock och går därifrån."] },
    { verb: ["ta", "klappa"], objekt: "duva", gor: ["Duvan flaxar upp på portiern och sätter sig på hans mössa. Han rör inte en min. Det har hänt förut."] },
    { verb: ["ge", "visa"], mottagare: "duva", gor: ["Duvan tittar på {objekt}, sedan på dig, och vänder dig ryggen. Den har sett bättre erbjudanden på Park Avenue."] },
    { verb: "ta", objekt: "korg", gor: ["Korgen ska stå kvar och vänta på sin ägare. Det är det enda den kan göra. Du förstår precis hur den känner sig."] },
    { verb: "ta", objekt: "krona", gor: ["Du når inte upp. Och om du gjorde det skulle du hänga i en kristallkrona inför fru Pettigrew, vilket inte är professionellt."] },
    { verb: "ta", objekt: "soffa", gor: ["Du tänker sätta dig. Sedan tittar du ner på din regnrock. Du står kvar."] },
    { verb: "ta", objekt: "palm", gor: ["Palmen är tung och dessutom inte din. Två goda skäl, och du behöver egentligen bara ett."] },
    { verb: "ta", objekt: "matta", gor: ["Mattan väger mer än du och är värd mer än hela ditt kvarter. Du låter den ligga."] },
    { verb: "prata", objekt: "stand", gor: ["Gumman säger något på kantonesiska som får en förbipasserande att skratta högt. Sedan pekar hon på bläckfisken. Du förstår att det är ett erbjudande."] },
    { verb: ["ta", "ät", "köp"], objekt: "stand", gor: ["En torkad bläckfisk kostar en dollar, och smakar som en sko som har varit till sjöss. Du avstår."] },
    { verb: "visa", objekt: "foto", mottagare: "stand", gor: ["Gumman tittar på fotot och pekar bestämt mot Golden Dragon. \"Fråga Benny\", säger hon. \"Benny vet allt. Benny pratar för mycket.\""] },
    { verb: ["ge", "visa"], mottagare: "stand", gor: ["Gumman skakar på huvudet och pekar på bläckfisken. Hon gör affärer, inte byteshandel."] },
    { verb: "ta", objekt: "cykel", gor: ["Cykeln sitter fast med en kedja som är tjockare än din arm. Du hade ändå inte kommit långt i det här regnet."] },
    { verb: "ta", objekt: "lyktor", gor: ["Lyktorna hänger för högt, och dessutom vore det otur. Det är hela poängen med dem."] },
    { verb: ["klappa", "prata"], objekt: "katt", gor: ["Du vinkar tillbaka till katten. Benny tittar på dig genom luckan. Du slutar vinka."] },
    { verb: "ta", objekt: "katt", gor: ["\"Rör inte katten\", säger Benny utan att titta upp. \"Den har jobbat här längre än jag.\""] },
    { verb: "ta", objekt: "akvarium", gor: ["Karpen tittar på dig med ett uttryck som säger: försök bara."] },
    { verb: "ta", objekt: "vatten", gor: ["Du doppar fingrarna i hamnvattnet. Det är kallt och oljigt och luktar diesel. Du torkar av handen på rocken. Rocken har varit med om värre."] },
    { verb: "ta", objekt: "pirlador", gor: ["Lådorna är spikade igen och väger som ett dåligt samvete. Du låter dem stå."] },
    { verb: "prata", objekt: "sovare", gor: ["Mannen muttrar \"inte nu, mamma\" och vänder sig om under tidningen."] },
    { verb: ["ta", "klappa"], objekt: "sovare", gor: ["Du låter honom sova. Han är den ende i stan som inte har några problem just nu."] },
    { verb: ["ge", "visa"], mottagare: "sovare", gor: ["Mannen snarkar. Det är ett nej."] },
    { verb: "prata", objekt: "fiolspelare", gor: ["Fiolspelaren öppnar ena ögat och spelar lite starkare. Du förstår att samtalet är över."] },
    { verb: "ta", objekt: "fiolspelare", gor: ["Han är mitt i en fuga. Man avbryter inte en man mitt i en fuga."] },
    { verb: "ge", objekt: "dollar", mottagare: "fiolspelare", gor: ["Du tänker lägga dollarn i fiollådan. Sedan tänker du på varmkorv. Bach får klara sig utan dig ikväll."] },
    { verb: ["ge", "visa"], mottagare: "fiolspelare", gor: ["Fiolspelaren nickar artigt utan att sluta spela. Han tar inte emot något som inte klingar."] },
    { verb: "ta", objekt: "fiollada", gor: ["Du är privatdetektiv, inte ficktjuv. Dessutom ligger det mest en operabiljett där, och du hatar opera."] },
    { verb: "ta", objekt: "spar", gor: ["Du böjer dig inte ner mot strömskenan. Du har ett fall att lösa och en hyra att betala, i den ordningen."] },
    { verb: "ta", objekt: "jordnotter", gor: ["Du är hungrig, men det finns gränser. Gränsen går precis vid jordnötsskal från golvet."] },
    { verb: ["gå", "ta"], objekt: "vagn", gor: ["Vagnen står inne, men tåget åker inte förrän du bestämmer vart. Linjekartan på väggen visar vart du kan åka."] },
    { verb: "ta", objekt: "resenarer", gor: ["Du knuffar ingen. Ankan har redan valt dig som fiende, och du vill inte ge den fler skäl."] },
    { verb: "ta", objekt: "pol", gor: ["Du doppar inte handen i pölen. Det har gått råttor genom den. Du har sett dem."] },

    // Kontoret
    { verb: ["svara", "lyssna", "ta"], objekt: "svarare", om: { inteFlagga: "uppdrag" }, gor: [{ samtal: "prim" }] },
    { verb: "svara", om: { har: "svarare", inteFlagga: "uppdrag" }, gor: [{ samtal: "prim" }] },
    { verb: ["svara", "lyssna"], objekt: "svarare", gor: ["Telefonen är tyst nu. Telefonsvararen bredvid blinkar inte. Bandet är fortfarande fullt av fru Pettigrews tack."] },
    { verb: "svara", gor: ["Det är ingen som frågar något."] },
    { verb: "ta", objekt: "svarare", gor: ["Du lyfter luren. Det tutar. Ingen ringer. Du lägger på igen och känner dig ensam."] },
    { verb: "ta", objekt: "papegojfoto", gor: ["Fotot får hänga kvar. Det är det enda på väggen som inte är en räkning eller en mops."] },
    { verb: "tänd", objekt: "ficklampa", gor: [{ ljud: "klick" }, "Du knäpper på ficklampan. Ett starkt, vitt ljus. Ever-Bright. Du knäpper av den igen för att spara på den, fast det inte verkar behövas."] },
    { verb: "tänd", gor: ["Du har inget att tända."] },
    { verb: "ta på", objekt: "rock", gor: ["Du drar på dig den nytvättade trenchcoaten. Den sitter som en handske. En ren handske. Det känns som någon annans rock."] },
    { verb: "sök", objekt: "rock", gor: ["Fickorna är tomma och rena. Fru Grubb har tvättat bort allt, även luddet. Du saknar luddet."] },

    // Brevet mot ljuset
    { verb: ["använd", "håll", "visa"], objekt: "utpressningsbrev", mottagare: ["lampa", "bordslampa", "gatlykta", "glodlampor", "armaturer", "lysror", "perronglyktor", "hotellneon", "fyrtorn", "papperslyktor", "lyktor", "ficklampa", "onair"], gor: [{ kor: "vattenmarke" }] },
    { verb: "håll", om: { bar: "utpressningsbrev", ord: ["ljus*", "lamp*", "lykt*", "fönster*"] }, gor: [{ kor: "vattenmarke" }] },
    { verb: "använd", objekt: "ficklampa", mottagare: "utpressningsbrev", gor: [{ kor: "vattenmarke" }] },
    { verb: "håll", gor: ["Du håller upp händerna. Ingen skjuter. Det är en bra dag."] },

    // Main Street, västra delen och polisen
    { verb: "prata", objekt: "trafikpolis", gor: ["\"Gå, gå, gå!\" ropar trafikpolisen och viftar. Du går. Det är ingen annan som gör det."] },
    { verb: "ta", objekt: "brevlada", gor: ["Brevlådan sitter fast i trottoaren. Du skulle inte ha något att posta ändå. Du har inga vänner som kan läsa."] },
    { verb: "prata", objekt: "sergeant", om: { flagga: "polis" }, gor: ["\"Bra jobbat\", muttrar sergeant Muldoon utan att titta upp. Sedan, lägre: \"Långkalsonger.\" Han fnissar. Han får gå ut en stund."] },
    { verb: "prata", objekt: "sergeant", gor: ["\"Kommissarien är där inne\", säger sergeant Muldoon och pekar med pennan. \"Han har hicka. Säg inget roligt. Särskilt inte om underkläder.\""] },
    { verb: ["prata", "väck"], objekt: "fyllo", gor: ["Fyllbulten öppnar ett öga. \"Jag röstar på båda\", säger han. \"Då vinner jag alltid.\" Han somnar om. Det är den klokaste politiska analys du hört i veckan."] },
    { verb: "prata", objekt: "ohara", gor: [{ samtal: "ohara" }] },
    { verb: "ta", objekt: "kaffebryggare", gor: ["Du häller upp en kopp av kommissariens kaffe. Det rinner ut som tjära. Du ställer tillbaka koppen och respekterar polisen lite mer."] },
    { verb: ["ge", "visa"], objekt: "utpressningsbrev", mottagare: "ohara", gor: ["O'Hara läser brevet. Han hickar fyra gånger på rad. \"Lila bläck. Fin handstil. Dyrt papper. Någon med pengar och stil.\" Han lämnar tillbaka det. \"Hitta personen, så tar jag hand om resten. *Hick.*\""] },
    { verb: ["ge", "visa"], objekt: "skuldsedel", mottagare: "ohara", gor: ["O'Hara läser skuldsedeln. \"V.V.? Lucky Lou? *Hick.* Intressant. Få dem att erkänna, så skickar jag bilarna.\""] },
    { verb: ["ge", "visa"], mottagare: "ohara", gor: ["\"Det där är inget bevis för någonting\", säger O'Hara. \"*Hick.* Utom för att ni har för mycket i fickorna.\""] },

    // Hotellet
    { verb: "prata", objekt: "hotellportier", gor: ["\"God kväll, sir\", säger portiern och tittar på din rock, eller bristen på rock. \"Baren kräver ytterrock. Bara så att ni vet.\""] },
    { verb: "prata", objekt: "concierge", om: { flagga: "conciergeBorta" }, gor: ["Conciergen är i bakrummet och pratar med sin mamma. \"Ja, mamma. Nej, mamma. Jag har varma strumpor, mamma.\""] },
    { verb: "prata", objekt: "concierge", gor: ["\"Fennimore, till er tjänst\", säger conciergen. \"Jag kan ordna rum, bord, biljetter och taxi. Jag kan inte ordna upplysningar om våra gäster. Det är hotellets policy sedan 1903.\" Han lägger en hand på gästboken."] },
    { verb: "ring", objekt: "ringklocka", gor: [{ ljud: "klirr" }, "Pling! Conciergen tittar upp. \"Ja, sir?\" Du har inget att säga. Han väntar. Du väntar. \"Ja, sir?\" upprepar han. Det blir till slut en tävling i artighet som du förlorar."] },
    { verb: "ring", om: { har: "ringklocka" }, gor: [{ utfor: "ring i ringklockan" }] },
    { verb: ["läs", "undersök"], objekt: "gastbok", om: { flagga: "conciergeBorta" }, gor: [
      "Du vänder på gästboken och läser snabbt, med ett öga på bakrummet. Namn i svart, blått, grönt. Rum 401 till 420: HANK HOLLISTER, KANDIDAT, och en hel valstab. Rum 312: MR. OCH MRS. SMITH, för femte gången i år. Och rum 507: MISS V. VANE, KAMPANJCHEF, i en elegant handstil, med lila bläck.",
      { om: { inteFlagga: "gastbok" }, poang: "gastbok" }, { satt: "gastbok" },
    ] },
    { verb: ["läs", "undersök", "ta"], objekt: "gastbok", gor: ["Du sträcker dig efter gästboken. Conciergen lägger handen på den, artigt men bestämt, som en mycket välklädd fälla. \"Gästboken är för gäster, sir. Sedan 1903.\""] },
    { verb: "prata", objekt: "piccolo", gor: [{ samtal: "piccolo" }] },
    { verb: ["ge", "visa"], objekt: "autograf", mottagare: "piccolo", gor: [{ samtal: "piccolo", nod: "autograf" }] },
    { verb: ["ge", "visa"], mottagare: "piccolo", gor: ["Piccolon tittar på {objekt}. \"Fint, sir. Men jag samlar autografer.\""] },
    { verb: "ta", objekt: "hotellpalm", gor: ["Palmen är större än du och har bättre hållning. Den får stå kvar."] },
    { verb: "prata", objekt: "vane", gor: [{ samtal: "vane" }] },
    { verb: ["ge", "visa"], objekt: "utpressningsbrev", mottagare: "vane", gor: ["Vivian Vane tittar på brevet utan att röra en min. \"Vackert skrivet. Vem det än var. Halva stan har lila bläck, detektiven.\" Hon blåser rök på det."] },
    { verb: ["ge", "visa"], mottagare: "vane", gor: ["\"Hur gulligt\", säger Vivian Vane och tittar på {objekt}. \"Behåll det.\""] },
    { verb: "prata", objekt: "hotellbartender", gor: ["\"Vad får det vara?\" frågar Ramón och skakar. \"Vi har lila, lila och lila. Miss Vane har bestämt menyn den här veckan.\""] },
    { verb: ["ta", "köp", "ät"], objekt: "cocktail", gor: ["Det är miss Vanes cocktail. Att ta den vore ungefär som att ta köttbiten från en tiger. Ungefär lika hälsosamt också, gissar du."] },
    { verb: "ta", objekt: "bordslampa", gor: ["Du låter lampan stå. Den lyser upp något som kanske behöver lysas upp. Kanske din utredning."] },

    // Biografen
    { verb: "prata", objekt: "vaktmastare", gor: [{ samtal: "vaktmastare" }] },
    { verb: ["ta", "köp", "ät"], objekt: "popcornmaskin", gor: ["Popcorn kostar fem cent. Du har inga cent. Du andas in så mycket av doften som du kan. Det är nästan som att äta."] },

    // Parken
    { verb: "prata", objekt: "kastanjeman", gor: ["\"Varma kastanjer! Varma kastanjer!\" Kastanjegubben tittar på dig. \"Fem cent. Har ni inga fem cent får ni lukta. Lukt är gratis. Än så länge. Vänta tills efter valet.\""] },
    { verb: ["ta", "köp", "ät"], objekt: "kastanjeman", gor: ["Fem cent för en strut. Du har inga cent. Gubben ger dig en bränd kastanj gratis, för att du ser ut att behöva den. Du äter den. Den smakar som hopp, fast bränt."] },
    { verb: "ta", objekt: "parkbank", gor: ["Du provar hatten. Den sitter på toppen av ditt huvud som en kaffekopp. Du lägger tillbaka den."] },
    { verb: "prata", objekt: "batkarl", gor: [{ samtal: "batkarl" }] },
    { verb: ["ta", "köp"], objekt: "svanbat", gor: ["En svanbåt kostar 25 cent i halvtimmen. Du har inga 25 cent. Och ingen att trampa med. Det är två goda skäl."] },
    { verb: ["ta", "klappa", "prata"], objekt: "ankor", gor: ["Ankorna simmar fram, ser att du inte har bröd, och simmar bort med ett föraktfullt snatter. Även ankor har förväntningar."] },
    { verb: "prata", objekt: "tubaspelare", gor: ["Tubaspelaren slutar spela. \"Ni är den första på tre veckor som har stannat\", säger han. \"Vill ni höra något särskilt?\" Innan du hinner svara börjar han spela karusellmusik. \"Den här visslar alla på sistone\", säger han mellan två toner. \"Jag har inte en aning om varför.\""] },

    // Chinatown och bakgatan
    { verb: "prata", objekt: "benny", gor: ["\"Detektiven!\" Benny vänder en dumpling i luften. \"Valet, valet, valet. Alla pratar om valet. Ingen pratar om min mat. Ta en lyckokaka. De vet mer om framtiden än politikerna.\""] },
    { verb: "ta", objekt: "lyckokaka", gor: [{ flytta: "lyckokaka", till: "spelare" }, "Du tar en lyckokaka ur skålen. \"Gratis\", säger Benny. \"Till efter valet. Sedan blir det skatt på lycka.\""] },
    { verb: "bryt", om: { inteInom: "lyckokaka" }, gor: ["Du har ingen lyckokaka."] },
    { verb: ["bryt", "läs", "öppna", "ät"], objekt: "lyckokaka", gor: [
      { flytta: "lyckokaka", ljud: "krack" },
      "Du bryter lyckokakan och vecklar ut lappen. Det står: \"DEN GYLLENE DRAKEN SOVER ALDRIG.\" Och med mindre text under, som om någon hade lagt till det i efterhand: \"Säg det vid den röda dörren.\"",
      { sys: "Du äter upp kakan. Den smakar papp och lösenord." },
      { satt: "lyckokakaLast" },
    ] },
    { verb: "bryt", gor: ["Du har inget att bryta."] },
    { verb: ["slå på", "knacka", "använd", "ring", "slå"], objekt: "titthal", om: { inteFlagga: "losen" }, gor: [{ ljud: "gok" }, { samtal: "dorrlucka" }] },
    { verb: ["slå på", "knacka", "använd", "ring", "slå"], objekt: "titthal", gor: ["Dörren står redan på glänt. Den väntar på dig, som en mycket diskret inbjudan."] },
    { verb: "knacka", om: { plats: "bakgata", inteFlagga: "losen" }, gor: [{ ljud: "gok" }, { samtal: "dorrlucka" }] },
    { verb: "ta", objekt: "torklina", gor: ["Du är detektiv, inte tvättkleptoman. Och det enda röda på linorna är en ensam strumpa."] },
    { verb: "prata", objekt: "apotekare", om: { flagga: "losen" }, gor: ["Mäster Wu nickar mot den röda dörren utan att säga något. Sedan säger han: \"Turen vänder alltid. Särskilt för dem som spelar.\""] },
    { verb: "prata", objekt: "apotekare", gor: ["Mäster Wu tittar på dig över glasögonen. \"Ni söker något\", säger han. \"Alla som kommer hit söker något. Oftast är det mot hosta.\" Han pekar diskret mot bakgatan. \"Den röda dörren? Där spelar man. Man säger att de vill höra något om en drake. Men jag säger ingenting. Jag är apotekare, inte drake.\""] },
    { verb: ["ta", "köp"], objekt: ["burkar", "torkade", "vag2"], gor: ["Mäster Wu skakar på huvudet. \"Det där är inte för er. Ni behöver sömn, kaffe och ett fall som löser sig självt. Det har jag inte i lager.\""] },
    { verb: "prata", objekt: "croupier", gor: ["\"Placera era insatser\", säger Diamant-Dino utan att titta upp. Diamanten i framtanden blinkar. \"Ni har inga insatser? Då är ni turist. Turister får titta. Men en sak, turist: om ni ser Lucky Lou, säg att han är skyldig mig tjugo dollar. Han har lovat att betala på fredag. Han lovar alltid att betala på fredag.\""] },
    { verb: "prata", objekt: "spelare", gor: ["Spelaren tittar upp med blanka ögon. \"Lucky Lou? Han var här i förrgår och förlorade allt. Sedan sa han att han hade ett jobb åt en dam i lila som skulle göra honom rik. Han visslade när han gick. Den där karusellmelodin. Jag har haft den i huvudet i två dagar. Hjälp mig.\""] },
    { verb: ["ta", "spela"], objekt: ["roulett", "mahjong"], gor: ["Du har inga insatser. Och de fyra damerna vid mahjongbordet ser ut som om de skulle ta dina skor om du förlorade."] },

    // Boulevarden
    { verb: "prata", objekt: "tidningsforsaljare", gor: ["\"EXTRA, EXTRA! BIGSBY MOT HOLLISTER I RADIO I MORGON! BORGMÄSTAREN SER BEKYMRAD UT!\" Lenny sänker rösten. \"Han har sett bekymrad ut i två dagar. Det har han aldrig gjort förut. Inte ens när rådhuset brann.\""] },
    { verb: "ring", objekt: "porttelefon", gor: ["Du trycker på knappen för tredje våningen. Det surrar. Ingen svarar. H. Smith har flyttat, och ingen har flyttat in. Folk säger att lägenheten luktar dåligt samvete."] },
    { verb: "prata", objekt: "dam", gor: ["\"Ezekiel Harbor\", säger damen och pekar på fontänen med en brödbit. \"Det är han som står där. Grundaren. Han pekar mot en krog. Och rådhusklockan har gått sedan 1889 utan att slå fel en enda gång. Jag vet sådant. Jag har suttit här länge.\""] },
    { verb: "prata", objekt: "pantlanare", gor: ["\"Checken!\" säger Mr. Pickles och pekar stolt på montern. \"Folk kommer från Park Avenue för att skratta åt den. Jag har sålt fler grejer i år än på tio år. Tack, detektiven.\" Han är tyst en stund. \"Säg det inte till någon.\""] },
    { verb: "prata", objekt: "urmakaren", gor: ["\"Fasadklockan slår tolv vid midnatt nu\", säger Otto Tick sorgset. \"Jag lagade den. Folk ville det. Men jag saknar den trettonde. Den var lite som en vän.\""] },
    { verb: "prata", objekt: "receptionist", om: { flagga: "radhus" }, gor: [{ samtal: "reception", nod: "igen" }] },
    { verb: "prata", objekt: "receptionist", gor: [{ samtal: "reception" }] },
    { verb: "prata", objekt: "borgmastaren", om: { flagga: "vunnit" }, gor: ["\"Detektiven! Min hjälte!\" ropar borgmästaren. Han har kalsongerna på sig. Det syns. Det ska inte synas."] },
    { verb: ["ge", "visa"], objekt: "kalsonger", mottagare: ["borgmastaren", "prim"], gor: [{ kor: "vinst" }] },
    { verb: "prata", objekt: "borgmastaren", om: { flagga: "klient" }, gor: [{ samtal: "borgmastare", nod: "igen" }] },
    { verb: "prata", objekt: "borgmastaren", gor: [{ samtal: "borgmastare" }] },
    { verb: "prata", objekt: "prim", gor: ["\"Hitta dem\", viskar fröken Prim. \"Han sover inte utan dem. Ingen av oss sover.\""] },
    { verb: ["ge", "visa"], objekt: "utpressningsbrev", mottagare: ["borgmastaren", "prim"], gor: ["\"Jag vill inte se det!\" ropar borgmästaren. \"Ta bort det! Hitta den som skrev det!\""] },

  // Varianter för klickläget, där man inte kan skriva. Används i stället för texten med samma namn utan "Klick".
  spelSlutKlick: "Spelet är slut. Välj Börja om i menyn för att spela igen.",

// I klickläget används <namn>Klick i stället för <namn>, utom när äventyret självt har bytt ut <namn> men inte <namn>Klick
if (A.lage === "klick") for (const k of Object.keys(TEXTER)) {

// ---------------------------------------------------------------------------
//  Svenska: riktningar, utfyllnadsord och verb
// ---------------------------------------------------------------------------
const RIKTNINGAR = {
  n: "n", norr: "n", nord: "n", s: "s", söder: "s", syd: "s", ö: "ö", öster: "ö", öst: "ö", o: "ö",
  v: "v", väster: "v", väst: "v", upp: "upp", uppåt: "upp", ner: "ner", nedåt: "ner", ned: "ner",
  in: "in", innanför: "in", ut: "ut", utåt: "ut", ute: "ut",
};
const UTFYLLNAD = new Set(["den", "det", "de", "en", "ett", "min", "mitt", "mina", "lite", "the", "och", "så", "sedan", "då", "försiktigt", "snabbt"]);
// Motorns verb: kanoniskt namn -> ord som betyder samma sak. Äventyret kan lägga till egna verb och ord.
const MOTORVERB = {
  titta: ["titta", "t", "se", "beskriv", "kolla"],
  undersök: ["undersök", "u", "granska", "studera", "inspektera", "betrakta"],
  sök: ["sök", "leta", "rota", "känn"],
  "ta på": ["ta på"],
  ta: ["ta", "plocka", "hämta", "grip", "lyft", "bär"],
  släpp: ["släpp", "lägg", "ställ", "kasta"],
  inventarie: ["i", "inv", "inventarie", "inventering", "ägodelar", "fickor"],
  öppna: ["öppna"], stäng: ["stäng"], läs: ["läs"],
  lyssna: ["lyssna", "spela", "tryck"],
  ge: ["ge", "erbjud", "räck"], mata: ["mata"], visa: ["visa"],

  ät: ["ät", "smaka"], klappa: ["klappa", "kela"],

const VERB = {};   // ord -> kanoniskt verb (två ord före ett)
function laggTillVerb(tabell) {
  for (const [kanon, ord] of Object.entries(tabell)) for (const o of ord) VERB[o] = kanon;
}
laggTillVerb(MOTORVERB);
laggTillVerb(A.verb || {});
if (A.resor) laggTillVerb({ "åk": A.resor.verb || ["åk", "res"] });
const META = {
  hjälp: ["hjälp", "help", "?", "instruktioner"], ledtråd: ["ledtråd", "tips", "hint"], poäng: ["poäng", "score", "status"],
  spara: ["spara", "save"], ladda: ["ladda", "load", "återställ"], bild: ["bild", "bilder"], ljud: ["ljud"], musik: ["musik"],
  omstart: ["omstart", "restart", "börja om"],

// ---------------------------------------------------------------------------
//  Spelets tillstånd
// ---------------------------------------------------------------------------
const RUM = A.rum, OBJ = A.objekt, POANG = A.poang || {};
const MAX = A.maxPoang || Object.values(POANG).reduce((a, p) => a + p[0], 0);
const NYCKEL = A.id || "aventyr";
let S;
function nyttTillstand() {

  return { room: A.start, moves: 0, score: 0, loc, f: {}, oppen, scored: {}, over: false, besokt: {}, kortNr: {} };
}

// ---------------------------------------------------------------------------
//  Gränssnittet (byggs av motorn)
// ---------------------------------------------------------------------------
const sk = A.startskarm;
// Bilder kan lånas från ett annat äventyr med A.bildmapp, t.ex. "../annat/bilder/"
const bildvag = p => A.bildmapp && p.startsWith("bilder/") ? A.bildmapp + p.slice(7) : p;
document.title = A.titel;
document.body.insertAdjacentHTML("afterbegin", `

<header class="status"><div class="wrap">

function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const logEl = document.getElementById("log");

const fyll = document.getElementById("fyll");

const pekskarm = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);

function out(text, cls) {
  const p = document.createElement("p");
  if (cls) p.className = cls;
  p.textContent = text;
  logEl.appendChild(p);

}
function scrollDown() { requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; }); }
function scrollTill(el) {

let haller = null;

// En liten gul pil till höger när det finns mer text att läsa längre ner

document.body.appendChild(merPil);
let pilRaf = 0;

new MutationObserver(visaMerPil).observe(logEl, { childList: true, subtree: true, characterData: true });
