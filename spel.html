<style>
/* Layout: en arkivmapp för ett fall. Statusrad överst, maskinskrivet protokoll i mitten, inmatningsrad längst ner. */
:root {
  --bg: #e6dbbd;       /* manilamapp */
  --paper: #f4eedc;    /* papper */
  --ink: #2a251d;      /* skrivmaskinsbläck */
  --muted: #6e6552;
  --stamp: #a8281f;    /* stämpelrött */
  --rule: #cdbf98;
  --font-type: "Courier Prime", "Courier New", Courier, monospace;
  --font-head: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141922; --paper: #1c2330; --ink: #e5e0d2; --muted: #8e95a3; --stamp: #ff7c6c; --rule: #2e3746;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141922; --paper: #1c2330; --ink: #e5e0d2; --muted: #8e95a3; --stamp: #ff7c6c; --rule: #2e3746;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-type); font-size: 16px; line-height: 1.55;
  display: flex; flex-direction: column;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  width: 100%; max-width: 46rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.status {
  border-bottom: 2px solid var(--ink);
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .06em;
}
header.status .wrap {
  display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between;
  padding-block: 10px 8px;
}
.status .title { font-weight: 600; font-size: 1.05rem; color: var(--stamp); }
.status .where { font-weight: 500; font-size: 1rem; flex: 1 1 auto; min-width: 0; }
.status .nums { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
main {
  flex: 1 1 auto; overflow-y: auto; min-height: 0;
}
#log { padding-block: 20px 12px; display: flex; flex-direction: column; gap: 12px; }
#log p { margin: 0; max-width: 65ch; white-space: pre-wrap; overflow-wrap: anywhere; }
#log .cmd { color: var(--muted); }
#log .cmd::before { content: "> "; }
#log .room { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: 1.05rem; margin-top: 6px; }
#log .sys { color: var(--muted); font-style: italic; }
#log .stamp {
  align-self: flex-start; color: var(--stamp); border: 3px double var(--stamp);
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .12em; font-weight: 600;
  padding: 4px 12px; transform: rotate(-2deg); margin-block: 4px;
}
#log .banner {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .1em;
  font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.05; font-weight: 600; text-wrap: balance;
}
#log .score { color: var(--stamp); font-weight: 700; }
/* Bildrutan: pixelbilden skalas upp skarpt, utan utsmetning. */
.scen { margin: 0; background: #0b0d1a; border-bottom: 2px solid var(--ink); display: flex; justify-content: center; }
.scen canvas {
  display: block; width: 384px; height: 240px; max-width: 100%; object-fit: contain;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
.scen canvas.ritar { animation: rita 0.9s steps(24, end) both; }
@keyframes rita { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
@media (prefers-reduced-motion: reduce) { .scen canvas.ritar { animation: none; } }
footer.input { border-top: 2px solid var(--ink); background: var(--paper); padding-bottom: env(safe-area-inset-bottom, 0px); }
footer.input .wrap { padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
form { display: flex; gap: 8px; align-items: center; }
form label { font-weight: 700; color: var(--stamp); }
#cmd {
  flex: 1 1 auto; min-width: 0; font: inherit; color: var(--ink); background: transparent;
  border: none; border-bottom: 1px dashed var(--rule); padding: 6px 2px; outline: none;
}
#cmd:focus-visible { border-bottom-color: var(--stamp); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button {
  font-family: var(--font-head); text-transform: uppercase; letter-spacing: .06em; font-size: .8rem;
  color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 2px;
  padding: 4px 10px; cursor: pointer;
}
.quick button:hover { border-color: var(--ink); }
.quick button:focus-visible { outline: 2px solid var(--stamp); outline-offset: 1px; }
</style>

const fyll = document.getElementById("fyll");
function scrollTill(el) {
  requestAnimationFrame(() => {
    if (!el || !el.isConnected) { fyll.style.height = "0px"; scroller.scrollTop = 0; return; }
    // Tomt utrymme under ett kort svar, så att kommandot ändå kan hamna överst.

    fyll.style.height = Math.max(0, scroller.clientHeight - kvar - 12) + "px";
    scroller.scrollTop += el.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 12;

const BILD_KEY = "mopsen-som-forsvann-bilder";

const rorelseOk = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const FARG = BILDDATA.palett.map(([r, g, b]) => `rgb(${r},${g},${b})`);
// Packa upp animationsrutorna (base64, tre byte per pixel) till listor med x, y och färg.
for (const anims of Object.values(BILDDATA.bilder)) {
  for (const a of anims) {
    a.ramar = a.ramar.map(str => {
      const bin = atob(str), ut = new Uint16Array(bin.length);
      for (let i = 0; i < bin.length; i += 3) {
        const pos = (bin.charCodeAt(i) << 8) | bin.charCodeAt(i + 1);
        ut[i] = pos % 192; ut[i + 1] = Math.floor(pos / 192); ut[i + 2] = bin.charCodeAt(i + 2);
      }
      return ut;
    });
  }
}
const cv = document.getElementById("scenbild");
const scen = { namn: null, bas: null, klar: false, start: 0, senaste: "", raf: 0 };

function updateScene() {
  const fig = document.getElementById("scen");
  const namn = ROOMS[S.room].bild;
  if (!namn || !visaBilder) { fig.hidden = true; stoppaAnim(); scen.namn = null; return; }
  fig.hidden = false;
  fitScene();
  if (scen.namn !== namn) {
    scen.namn = namn; scen.klar = false; scen.senaste = "";
    cv.setAttribute("aria-label", "Bild: " + ROOMS[S.room].name);
    const img = new Image();
    img.onload = () => {
      if (scen.namn !== namn) return;
      scen.bas = img; scen.klar = true; scen.start = performance.now();
      ritaScen(true); startaAnim();
    };
    img.src = "bilder/" + namn + ".png";
    cv.classList.remove("ritar"); void cv.offsetWidth; cv.classList.add("ritar");
  } else {
    ritaScen(true); startaAnim();
  }
}
// Vilken ruta i en animation som gäller vid tiden t (millisekunder).
// Har animationen en "slinga" loopar bara de första rutorna; resten väljer spelet via animStyr.
function ramIndex(anim, t) {
  const n = anim.slinga || anim.ms.length;
  let r = t % anim.ms.slice(0, n).reduce((a, b) => a + b, 0);
  for (let i = 0; i < n; i++) { if (r < anim.ms[i]) return i; r -= anim.ms[i]; }
  return 0;
}
// Ritar grundbilden och lägger på de pixlar som ändras i varje animations aktuella ruta.
function ritaScen(tvinga) {
  if (!scen.klar) return;
  const anims = BILDDATA.bilder[scen.namn] || [];
  const styr = ROOMS[S.room].animStyr || {};
  const t = performance.now() - scen.start;
  const val = anims.map(a => {
    const fast = styr[a.namn] ? styr[a.namn](S) : null;
    if (fast !== null && fast !== undefined) return fast;
    return rorelseOk ? ramIndex(a, t) : -1;
  });
  const nyckel = val.join(",");
  if (!tvinga && nyckel === scen.senaste) return;
  scen.senaste = nyckel;
  const ctx = cv.getContext("2d");
  ctx.drawImage(scen.bas, 0, 0);
  anims.forEach((a, i) => {
    if (val[i] < 0) return;
    const p = a.ramar[val[i]];
    for (let k = 0; k < p.length; k += 3) { ctx.fillStyle = FARG[p[k + 2]]; ctx.fillRect(p[k], p[k + 1], 1, 1); }
  });
}
function startaAnim() {
  if (scen.raf || !rorelseOk) return;
  const loop = () => { ritaScen(); scen.raf = requestAnimationFrame(loop); };
  scen.raf = requestAnimationFrame(loop);
}
function stoppaAnim() { cancelAnimationFrame(scen.raf); scen.raf = 0; }

// Skala bilden med ett helt tal så att alla pixlar blir lika stora.
// På mobil (smal skärm i stående läge) fyller bilden i stället hela bredden.
function fitScene() {
  const vw = document.documentElement.clientWidth || window.innerWidth;
  if (vw < 700 && window.innerHeight > window.innerWidth) {
    cv.style.width = vw + "px";
    cv.style.height = Math.round(vw * 120 / 192) + "px";
    return;
  }
  const maxW = Math.min(window.innerWidth, 1200);
  const maxH = window.innerHeight * 0.36;
  let k = Math.floor(Math.min(maxW / 192, maxH / 120));
  if (k < 1) k = 1;
  if (k < 2 && maxW >= 384) k = 2;
  cv.style.width = 192 * k + "px";
  cv.style.height = 120 * k + "px";
}
window.addEventListener("resize", fitScene);

  visaBilder = !visaBilder;

const here = id => {
  const l = S.loc[id];
  return l === S.room || (l === "*station" && ROOMS[S.room].station);
};
const carried = id => S.loc[id] === "player";
const desc = (o) => typeof o.desc === "function" ? o.desc(S) : o.desc;
const isOpen = id => id === "lada" ? !!S.f.ladaOppen : true;

function inScope(id) {
  if (here(id) || carried(id)) return true;
  const c = S.loc[id];
  if (c && OBJ[c] && OBJ[c].container && isOpen(c) && inScope(c)) return true;
  return false;
}
function scopeList() { return Object.keys(OBJ).filter(inScope); }

// Hitta ett föremål utifrån orden i en fras. Prioritera det som är i närheten.
function resolve(phrase) {
  if (!phrase) return null;
  const p = " " + phrase + " ";
  let best = null, bestLen = 0;
  for (const id of scopeList()) {
    for (const n of OBJ[id].names) {
      if (p.includes(" " + n + " ") && n.length > bestLen) { best = id; bestLen = n.length; }
    }
  }
  return best;
}
// Känns ordet igen alls (även om föremålet inte är här)?
function knownAnywhere(phrase) {
  const p = " " + phrase + " ";
  return Object.keys(OBJ).some(id => OBJ[id].names.some(n => p.includes(" " + n + " ")));
}

function listRoomItems() {
  const items = Object.keys(OBJ).filter(id => here(id) && !OBJ[id].fixed && !OBJ[id].person);
  if (items.length) out("Här finns " + joinList(items.map(id => OBJ[id].short)) + ".");
}
function joinList(a) {
  if (a.length <= 1) return a.join("");
  return a.slice(0, -1).join(", ") + " och " + a[a.length - 1];
}

function ride(phrase) {
  if (!ROOMS[S.room].station) {
    out(ROOMS[S.room].exits.ner && ROOMS[ROOMS[S.room].exits.ner].station ? "Du måste först gå ner till perrongen." : "Det finns ingen tunnelbana här. Leta efter en trappa ner till en perrong.");
    return;
  }
  if (!phrase) { out("Vart vill du åka? Skriv till exempel ÅK TILL CHINATOWN."); return; }
  const p = " " + phrase + " ";
  let dest = null;
  for (const [id, st] of Object.entries(STATIONS)) {
    if (st.words.some(w => p.includes(" " + w + " "))) { dest = id; break; }
  }
  if (!dest) { out("Linjen har bara fyra stationer: Main Street, Park Avenue, Chinatown och Pir 9."); return; }

function take(phrase) {
  if (/\b(allt|alla|allting)\b/.test(phrase)) {
    const items = scopeList().filter(id => !carried(id) && !OBJ[id].fixed && !OBJ[id].person);
    if (!items.length) { out("Det finns inget här som är värt att ta. Du har kollat."); return; }
    items.forEach(id => { out(OBJ[id].short.replace(/^./, c => c.toUpperCase()) + ": taget."); takeEffects(id); S.loc[id] = "player"; });
    return;
  }
  const id = resolve(phrase);
  if (!id) return notHere(phrase);
  if (carried(id)) { out("Den har du redan."); return; }
  if (id === "mops") {
    if (!S.f.mopsVan) { out("Du sträcker in handen i buren. Lord Waffles visar tänderna. Alla tre. Du drar tillbaka handen medan du fortfarande har fem fingrar."); Ljud.effekt("morr"); return; }
    Ljud.effekt("skall");
    out("Du lyfter upp Lord Waffles. Han är förvånansvärt tung för sin storlek, ungefär som ett bowlingklot med åsikter.");

  if (OBJ[id].person) { out("Det vore olämpligt. Och troligen olagligt. Och troligen smärtsamt."); return; }
  if (OBJ[id].fixed) { out("Det sitter fast, eller är för stort, eller både och."); return; }

const FILLER = new Set(["den", "det", "de", "en", "ett", "min", "mitt", "mina", "lite", "the", "och", "så", "sedan", "då", "försiktigt", "snabbt"]);
function clean(words) { return words.filter(w => !FILLER.has(w)).join(" ").trim(); }
function splitOn(rest, preps) {
  const words = rest.split(" ");
  const i = words.findIndex(w => preps.includes(w));
  if (i < 0) return [clean(words), ""];
  return [clean(words.slice(0, i)), clean(words.slice(i + 1))];
}

function exec(raw) {
  let s = raw.toLowerCase().replace(/[.,!?;:"'()]/g, " ").replace(/\s+/g, " ").trim();
  if (!s) return out("Ursäkta?");
  // Flera kommandon med "och sedan" / "sen" / punkt kortas till det första; håll det enkelt.
  const w = s.split(" ");
  const v = w[0];
  const rest = w.slice(1).join(" ");
  const restClean = clean(w.slice(1));

  // Metakommandon som inte räknas som drag
  if (["hjälp", "help", "?", "instruktioner"].includes(v)) return help();
  if (["ledtråd", "tips", "hint"].includes(v)) return hint();
  if (["poäng", "score", "status"].includes(v)) return scoreReport();
  if (v === "spara" || v === "save") return save();
  if (v === "ladda" || v === "load" || v === "återställ") return load();
  if (v === "bild" || v === "bilder") return toggleBilder();
  if (v === "ljud") { const pa = Ljud.vaxlaLjud(); visaLjudknapp(); return out(pa ? "Ljudet är påslaget." : "Ljudet är avstängt. Skriv LJUD för att slå på det igen.", "sys"); }
  if (v === "musik") { const pa = Ljud.vaxlaMusik(); return out(pa ? "Musiken är påslagen." : "Musiken är avstängd. Miljöljud och effekter hörs fortfarande.", "sys"); }
  if (v === "omstart" || v === "restart" || s === "börja om") return restart();

  if (S.over) { out("Fallet är redan löst. Skriv OMSTART för att spela igen, eller POÄNG för att se hur det gick.", "sys"); return; }

  S.moves++;

  // Förflyttning
  if (DIRS[v] && w.length === 1) return go(DIRS[v]);
  if (["gå", "spring", "promenera", "kliv", "kryp", "gå"].includes(v)) {
    const d = w.slice(1).find(x => DIRS[x]);
    if (d) return go(DIRS[d]);
    if (/tunnelbana|perrong|trappa/.test(rest)) { const dn = ROOMS[S.room].exits.ner; if (dn) return go("ner"); }
    if (/restaurang|golden|dragon|lager|takvåning|hiss|in /.test(rest + " ")) return go("in");
    if (/kontor/.test(rest) && S.room === "mainst") return go("upp");
    if (/gata|ut/.test(rest)) return go(ROOMS[S.room].exits.ut ? "ut" : "upp");
    out("Vart vill du gå? Prova UPP, NER, IN eller UT.");
    return;
  }
  if (["åk", "res", "ta-tunnelbanan"].includes(v) || s.startsWith("ta tunnelbanan") || s.startsWith("ta tåget") || s.startsWith("ta taxi")) {
    if (/taxi/.test(s)) { out("Med din ekonomi? Taxichaufförerna i Grand Harbor tar betalt bara för att titta på dig. Ta tunnelbanan."); S.moves--; return; }
    const m = s.match(/\btill\b (.+)$/);
    return ride(m ? m[1] : "");
  }

  switch (v) {
    case "titta": case "l": case "se": case "beskriv": case "kolla":
      if (w[1] === "på" || w[1] === "i" || w[1] === "under") return w[1] === "på" ? examine(clean(w.slice(2))) : search(clean(w.slice(2)));
      if (restClean) return examine(restClean);
      return look();
    case "undersök": case "u": case "x": case "granska": case "studera": case "inspektera": case "betrakta":
      return examine(restClean);
    case "sök": case "leta": case "rota": case "känn":
      return search(clean(w.slice(1).filter(x => !["i", "igenom", "genom", "efter", "på"].includes(x))));
    case "ta": case "plocka": case "hämta": case "grip": case "lyft": case "bär":
      if (w[1] === "på" && v === "ta") return wear(clean(w.slice(2)));
      return take(clean(w.slice(1).filter(x => x !== "upp")));
    case "släpp": case "lägg": case "ställ": case "kasta":
      return drop(splitOn(restClean.replace(/^ner /, ""), ["i", "på"])[0]);
    case "i": case "inv": case "inventarie": case "inventering": case "ägodelar": case "fickor":
      return inventory();
    case "öppna": return openThing(restClean);
    case "stäng": return closeThing(restClean);
    case "läs": return read(restClean);
    case "lyssna": case "spela": case "tryck": case "lyssna-på":
      return listen(clean(w.slice(1).filter(x => !["på", "av", "upp"].includes(x))));
    case "köp": case "beställ": return buy(restClean);
    case "betala": return buy("korv");
    case "ge": case "erbjud": case "räck": {
      const [a, b] = splitOn(rest, ["till", "åt", "för"]);
      return give(a, b);
    }
    case "mata": {
      const [a, b] = splitOn(rest, ["med"]);
      return give(b || "kex", a);
    }
    case "visa": {
      const [a, b] = splitOn(rest, ["för", "till", "åt"]);
      return show(a, b);
    }
    case "prata": case "tala": case "fråga": case "säg": case "hälsa": case "förhör":
      return talk(splitOn(rest, ["med", "till", "på"])[1] || clean(w.slice(1).filter(x => x !== "om")));
    case "dyrka": case "bänd": return pick(restClean);
    case "lås":
      if (w[1] === "upp") return pick(clean(w.slice(2)));
      out("Du har inget att låsa med."); return;
    case "bryt": case "knäck": return breakCookie();
    case "ät": case "smaka": return eat(restClean);
    case "klappa": case "kela":
      out(resolve(restClean) === "mops" ? (S.f.mopsVan ? "Lord Waffles låter sig klappas med kunglig nedlåtenhet." : "Lord Waffles hugger efter dina fingrar. Han missar, men bara för att han inte ser så bra.") : "Det vill inte bli klappat.");
      return;
    case "slå": case "sparka": case "döda": case "skjut": case "attackera": case "brotta":
      return attack();
    case "vänta": case "z":
      out(["Tiden går. Regnet faller. Ingen ringer.", "Du väntar. Det är en del av jobbet som ingen pratar om.", "Du tänder en imaginär cigarett och funderar."][S.moves % 3]);
      return;
    case "sov": out("Du kan sova när du är död, eller när fallet är löst. Helst i den ordningen."); return;
    case "svär": out("Du svär en ramsa som skulle få en hamnarbetare att rodna. Det hjälper inte, men du mår lite bättre."); return;
    case "hoppa": out("Du hoppar. Grand Harbor är inte imponerat."); return;
    case "tänk": case "fundera": hint(); return;
    case "ring": out("Din telefon kan bara ta emot samtal. Telefonbolaget och du har en överenskommelse."); return;
    case "bli": case "lukta": case "nosa":
      out(S.room === "lager" ? "Friterade räkor och skräckslagen mops." : S.room === "restaurang" ? "Ingefära, vitlök och lyckokakor." : "Regn och avgaser. Grand Harbors parfym.");
      return;
  }
  S.moves--;
  out(`Jag förstår inte ordet "${v}". Skriv HJÄLP för exempel på kommandon.`);
}

// ================================================================
//  LJUD: musik, miljöljud och effekter.
//  Ljudfilerna i ljud/ skapas av verktyg/skapa_ljud.py och spelas upp med Web Audio.
// ================================================================
const Ljud = (() => {
  const KEY = "mopsen-som-forsvann-ljud";
  const inst = { ljud: true, musik: true };
  try { Object.assign(inst, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  const spara = () => { try { localStorage.setItem(KEY, JSON.stringify(inst)); } catch (e) {} };
  const AC = window.AudioContext || window.webkitAudioContext;
  const MUSIKNIVA = 0.42;
  let ctx = null, master, musikBus, miljoBus, sfxBus, timer = 0;
  let rum = null, lager = [], handelser = [], musikKalla = null;
  const buffertar = {}, langder = {};
  const slump = (a, b) => a + Math.random() * (b - a);

  // Miljöljud per plats: slingor [fil, volym] och händelser [fil, sekunder emellan, volym, villkor]
  const MILJO = {
    kontor:     { slingor: [["regn_inne", 0.75]], hand: [["tuta", 18, 0.18]] },
    mainst:     { slingor: [["regn_ute", 0.55]], hand: [["tuta", 9, 0.45]] },
    parkave:    { slingor: [["duggregn", 0.5]], hand: [["duva", 10, 0.45]] },
    vaning:     { slingor: [["vaning", 0.55]], hand: [] },
    china:      { slingor: [["regn_ute", 0.4], ["sorl", 0.5]], hand: [["cykelklocka", 11, 0.3]] },
    restaurang: { slingor: [["wok", 0.22], ["sorl", 0.45]], hand: [["klirr", 7, 0.35]] },
    pir:        { slingor: [["hamn", 0.7]], hand: [["mistlur", 15, 0.55], ["masar", 11, 0.3]] },
    lager:      { slingor: [["lager", 0.6]], hand: [["knarr", 12, 0.45], ["morr", 7, 0.35, () => S.loc.mops === "lager" && !S.f.mopsVan]] },
    p_main:     { slingor: [["tunnel", 0.6]], hand: [["tagforbi", 20, 0.55]] },
    p_park:     { slingor: [["tunnel", 0.4], ["fiol", 0.75]], hand: [], dampaMusik: true },
    p_china:    { slingor: [["tunnel", 0.55], ["sorl", 0.35]], hand: [["tagforbi", 22, 0.55]] },
    p_pir:      { slingor: [["tunnel", 0.5]], hand: [["dropp", 2.8, 0.5], ["rattpip", 13, 0.35]] },
  };
  const EFFEKTVOLYM = { poang: 0.45, fanfar: 0.9, svarare: 1, tunnelbana: 0.85, hiss: 0.6, prassel: 0.6 };

  function bygg() {
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = inst.ljud ? 1 : 0;
    master.connect(ctx.destination);
    musikBus = ctx.createGain(); musikBus.gain.value = 0; musikBus.connect(master);
    miljoBus = ctx.createGain(); miljoBus.gain.value = 0.85; miljoBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
  }
  // Läser in och avkodar en ljudfil (en gång per fil).
  function ladda(namn) {
    if (!buffertar[namn]) {
      buffertar[namn] = fetch("ljud/" + namn + ".mp3")
        .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(data => new Promise((ok, fel) => ctx.decodeAudioData(data, ok, fel)))
        .then(buf => { langder[namn] = buf.duration; return buf; })
        .catch(() => null);
    }
    return buffertar[namn];
  }
  // mp3 kan ha några millisekunder tystnad i början. Hitta var ljudet egentligen börjar
  // och loopa exakt den längd som generatorn angav, så blir slingan sömlös.
  function slingpunkter(buf, namn) {
    const n44 = (typeof SLINGOR !== "undefined" && SLINGOR[namn]) || 0;
    if (!n44) return [0, buf.duration];
    const n = Math.round(n44 * buf.sampleRate / 44100);
    if (buf.length < n) return [0, buf.duration];
    const d = buf.getChannelData(0);
    let start = 0;
    const max = Math.min(buf.length - n, 4096);
    while (start < max && Math.abs(d[start]) < 1e-4) start++;
    return [start / buf.sampleRate, (start + n) / buf.sampleRate];
  }
  function spelaSlinga(namn, buss, vol, fadein = 1.2) {
    const g = ctx.createGain(); g.gain.value = 0; g.connect(buss);
    const post = { g, kalla: null, stoppad: false };
    ladda(namn).then(buf => {
      if (!buf || post.stoppad) return;
      const s = ctx.createBufferSource();
      s.buffer = buf; s.loop = true;
      const [a, b] = slingpunkter(buf, namn);
      s.loopStart = a; s.loopEnd = b;
      s.connect(g);
      s.start(ctx.currentTime + 0.05, a + Math.random() * Math.max(0, b - a - 1) * (buss === musikBus ? 0 : 1));
      g.gain.setTargetAtTime(vol, ctx.currentTime, fadein / 3);
      post.kalla = s;
    });
    return post;
  }
  function stoppaSlinga(post, fadeut = 1.2) {
    post.stoppad = true;
    const nu = ctx.currentTime;
    post.g.gain.cancelScheduledValues(nu);
    post.g.gain.setTargetAtTime(0, nu, fadeut / 3);
    if (post.kalla) post.kalla.stop(nu + fadeut + 0.5);
  }
  function spelaEn(namn, vid, vol, buss = sfxBus) {
    ladda(namn).then(buf => {
      if (!buf) return;
      const s = ctx.createBufferSource(), g = ctx.createGain();
      s.buffer = buf; g.gain.value = vol;
      s.connect(g); g.connect(buss);
      s.start(Math.max(ctx.currentTime, vid));
    });
  }

  function musikNiva() {
    if (!inst.musik) return 0;
    return MILJO[rum] && MILJO[rum].dampaMusik ? MUSIKNIVA * 0.15 : MUSIKNIVA;
  }
  function startaMusik() {
    if (!musikKalla) musikKalla = spelaSlinga("jazz", musikBus, 1, 0.5);
    musikBus.gain.setTargetAtTime(musikNiva(), ctx.currentTime, 0.8);
  }
  function bytMiljo(id) {
    if (id === rum) return;
    rum = id;
    lager.forEach(l => stoppaSlinga(l));
    const m = MILJO[id] || { slingor: [], hand: [] };
    lager = m.slingor.map(([namn, vol]) => spelaSlinga(namn, miljoBus, vol));
    const nu = ctx.currentTime;
    handelser = m.hand.map(([namn, mellan, vol, villkor]) => ({ namn, mellan, vol, villkor, nasta: nu + slump(1.5, mellan) }));
    m.hand.forEach(([namn]) => ladda(namn));
    musikBus.gain.setTargetAtTime(musikNiva(), nu, 0.8);
  }
  function tick() {
    if (!ctx || ctx.state !== "running") return;
    const nu = ctx.currentTime;
    for (const h of handelser) {
      if (nu >= h.nasta) {
        if (!h.villkor || h.villkor()) spelaEn(h.namn, nu, h.vol * slump(0.7, 1), miljoBus);
        h.nasta = nu + h.mellan * slump(0.6, 1.4);
      }
    }
  }

  return {
    // Startar ljudet. Måste anropas från en användarhandling (tryck eller tangent).
    vakna() {
      if (!AC) return;
      if (!ctx) {
        try { bygg(); } catch (e) { return; }
        timer = setInterval(tick, 250);
        Object.keys(EFFEKTVOLYM).concat(["blipp", "klonk", "lada", "kassa", "gulp", "mage", "morr", "skall", "dyrk", "krack"]).forEach(ladda);
      }
      if (ctx.state === "suspended" && inst.ljud && !document.hidden) ctx.resume();
      startaMusik();
      if (S) bytMiljo(S.room);
    },
    miljo(id) { if (ctx) bytMiljo(id); },
    effekt(namn, fordrojning = 0) {
      if (!ctx || !inst.ljud) return;
      spelaEn(namn, ctx.currentTime + 0.03 + fordrojning, EFFEKTVOLYM[namn] || 0.8);
    },
    // Hur lång en effekt är (sekunder), om den är inläst
    langd(namn, reserv) { return langder[namn] || reserv; },
    vaxlaLjud() {
      inst.ljud = !inst.ljud; spara();
      this.vakna();
      if (ctx) { master.gain.setTargetAtTime(inst.ljud ? 1 : 0, ctx.currentTime, 0.1); if (inst.ljud) ctx.resume(); }
      return inst.ljud;
    },
    vaxlaMusik() {
      inst.musik = !inst.musik; spara();
      this.vakna();
      if (ctx) musikBus.gain.setTargetAtTime(musikNiva(), ctx.currentTime, 0.4);
      return inst.musik;
    },
    get pa() { return inst.ljud; },
    get musik() { return inst.musik; },
    pausa(p) { if (!ctx) return; if (p) ctx.suspend(); else if (inst.ljud) ctx.resume(); },
    get status() { return ctx ? { tillstand: ctx.state, rum, slingor: lager.length, musik: !!(musikKalla && musikKalla.kalla) } : null; },
  };
})();
document.addEventListener("pointerdown", () => Ljud.vakna());
document.addEventListener("keydown", () => Ljud.vakna());
document.addEventListener("visibilitychange", () => Ljud.pausa(document.hidden));

// ================================================================
//  START
// ================================================================
function intro() {
  out("Mopsen som försvann", "banner");
  out("Ett interaktivt deckaräventyr", "sys");
  out("Grand Harbor, 1947. Regnet faller som om det fått betalt per droppe. Du är privatdetektiv, och just nu är du en privatdetektiv utan uppdrag, utan pengar och utan kaffe. Två av tre är ditt eget fel.");
  out("Skriv HJÄLP om du inte vet vad du ska göra, eller LEDTRÅD om du kör fast.", "sys");
  out("Spelet har musik och ljud som startar när du skriver eller trycker första gången. Skriv LJUD eller MUSIK för att stänga av.", "sys");
  look();
}
function restart() {
  S = newState();
  logEl.innerHTML = "";
  intro();
}

const input = document.getElementById("cmd");
// På pekskärmar (mobil) döljs tangentbordet efter varje kommando. Det visas igen först när man trycker i fältet.
const pekskarm = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
// När tangentbordet stängs ändras textytans storlek. Lägg då om skrollningen så att kommandot står kvar överst.
let haller = null;
function hallKvar() {
  if (haller && performance.now() < haller.tills) scrollTill(haller.el);
}
window.addEventListener("resize", hallKvar);
if (window.visualViewport) window.visualViewport.addEventListener("resize", hallKvar);
// Slutar hålla fast så fort spelaren själv skrollar.
["touchstart", "wheel"].forEach(ev => scroller.addEventListener(ev, () => { haller = null; }, { passive: true }));
const history = []; let hIdx = 0;
function submit(text) {
  const t = text.trim();
  if (!t) return;
  fyll.style.height = "0px";
  ljudFordrojning = 0;
  const rad = out(t, "cmd");
  history.push(t); hIdx = history.length;
  nyScen = false;
  exec(t);
  updateStatus();
  // Vid en ny scen visas texten från början av svaret, annars från slutet.
  // På mobil hamnar kommandot alltid överst, så att man läser svaret uppifrån och skrollar själv.
  // Vid en ny scen gäller samma sak på dator; annars visas slutet av texten.
  if (pekskarm || nyScen) {
    scrollTill(rad);
    haller = { el: rad, tills: performance.now() + 1200 };
  } else {
    scrollDown();
  }
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  submit(input.value);
  input.value = "";
  if (pekskarm) input.blur();
});
input.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && hIdx > 0) { hIdx--; input.value = history[hIdx]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { hIdx = Math.min(history.length, hIdx + 1); input.value = history[hIdx] || ""; e.preventDefault(); }
});
document.getElementById("quick").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) { submit(b.dataset.c); if (pekskarm) b.blur(); else input.focus(); }
});

function visaLjudknapp() {
  const b = document.getElementById("ljudknapp");
  b.textContent = Ljud.pa ? "Ljud på" : "Ljud av";
  b.setAttribute("aria-pressed", String(Ljud.pa));
}
function start(data) {
  visaLjudknapp();
  if (data && data.state) {
    S = data.state;
    out("Du är tillbaka i fallet.", "sys");
    look();
  } else {
    S = newState();
    intro();
  }
  updateStatus();
  scrollTill(null);
  window.claude?.hot?.snapshot?.(() => ({ state: S }));
  if (!pekskarm) input.focus();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

// Gör spelmotorn testbar från konsolen.
window.__spel = { exec: t => { exec(t); updateStatus(); }, get state() { return S; } };
</script>
